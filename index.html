<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valve Timing Lab</title>
<meta name="description" content="Valve timing and firing order lab for ITI Mechanic Diesel trainees — 2D and 3D simulator, theory, practical and MCQ in Gujarati, Hindi and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecf5;--card:#fff;--ink:#0b1630;--mut:#3f4c63;--line:#c3cfdf;--pri:#1746d1;--S:#1558c4;--C:#0e7a3c;--P:#c41e24;--E:#4b525b;--I:#c98600;--acc:#ff7a00;--ok:#14a44d;--bad:#d93636}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Gujarati','Noto Sans Devanagari','Noto Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body.fsx{position:fixed;inset:0;overflow:auto;z-index:100;background:var(--bg)}
#app{max-width:1100px;margin:0 auto;padding:10px 12px 0}
header{background:linear-gradient(135deg,#1e3c8f,#1e5eff 55%,#00a3c4);color:#fff;border-radius:16px;padding:14px 14px 12px;box-shadow:0 6px 18px rgba(30,94,255,.25)}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:clamp(19px,4.6vw,27px);margin:0;line-height:1.25}
.sub{opacity:.92;font-size:13px;margin-top:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 11px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tools button.on{background:#fff;color:#1e3c8f}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button.on{background:var(--pri);color:#fff}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px rgba(20,33,61,.06);border:1px solid var(--line)}
.card h2{font-size:18px;margin:0 0 8px;color:#1e3c8f}
.card h3{font-size:16px;margin:14px 0 6px;color:#1e3c8f}
.remind{background:#fff7e0;border:1px solid #ffd77a;color:#6b4b00;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;margin-top:10px;min-height:44px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.grid2{grid-template-columns:1.05fr 1fr}}
canvas{display:block;max-width:100%}
.cvbox{background:linear-gradient(#f8fbff,#eef4fb);border-radius:12px;border:1px solid var(--line);display:flex;justify-content:center;padding:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.btn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:#e8eefc;color:#1e3c8f}
.btn.pri{background:var(--pri);color:#fff}
.btn.on{background:#1e3c8f;color:#fff}
.btn.sm{padding:6px 9px;font-size:13px}
input[type=range]{width:100%;accent-color:var(--pri);height:28px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.read div{background:#f3f7fd;border-radius:10px;padding:6px 9px;font-size:13px;border:1px solid var(--line)}
.read b{display:block;font-size:17px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;color:#fff;font-weight:700;font-size:13px}
.explain{border-left:6px solid var(--pri);background:#f4f8ff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;min-height:96px}
.explain .ttl{font-weight:800;font-size:16px;margin-bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.badge{display:inline-block;background:var(--I);color:#3a2a00;border-radius:8px;padding:2px 8px;font-weight:800;font-size:13px}
#v3wrap{position:relative;border-radius:12px;overflow:hidden;background:#0e1726}
#v3{touch-action:none;display:block;width:100%}
#v3lab{position:absolute;inset:0;pointer-events:none}
#v3lab .lb{position:absolute;transform:translate(-50%,-50%);background:rgba(10,20,40,.78);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
#v3lab .cy{font-size:12px;font-weight:800;padding:3px 7px;border:0}
#v3fire{position:absolute;right:8px;bottom:8px;background:rgba(232,69,69,.92);color:#fff;font-weight:800;border-radius:10px;padding:5px 10px;font-size:14px}
#v3hint{position:absolute;right:8px;top:36px;color:#cfe0ff;font-size:11px;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:6px}
#v3msg{position:absolute;left:0;right:0;top:40%;color:#fff;text-align:center;pointer-events:none}
.fochips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:20px;font-weight:800;margin:6px 0}
.fochips span.c{min-width:38px;text-align:center;background:#e8eefc;border-radius:10px;padding:2px 8px;transition:.2s}
.fochips span.c.on{background:var(--P);color:#fff;transform:scale(1.12)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#e8eefc;color:#1e3c8f}
tr:nth-child(even) td{background:#fafcff}
.note{background:#fff4e5;border-left:5px solid var(--acc);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.tip{background:#e9f8ef;border-left:5px solid var(--ok);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.formula{background:#f0f4ff;border:1px dashed #9db4ff;border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:700;font-family:'Noto Sans',monospace}
details.acc{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;overflow:hidden}
details.acc>summary{cursor:pointer;padding:11px 12px;font-weight:800;font-size:16px;color:#1e3c8f;background:#f3f7fd;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:before{content:'▸ ';}
details.acc[open]>summary:before{content:'▾ ';}
details.acc .bd{padding:4px 12px 10px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin:8px 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig .cap{font-size:13px;color:var(--mut);margin-top:2px}
.sl{display:grid;grid-template-columns:92px 1fr 52px;gap:6px;align-items:center;font-size:14px;font-weight:700}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:8px}
.res div{background:#f3f7fd;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}
.res b{font-size:18px;display:block;color:#1e3c8f}
.evchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mcq{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}
.mcq .q{font-weight:800;margin-bottom:6px}
.mcq .op{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fafcff;border-radius:10px;padding:8px 10px;margin:5px 0;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.mcq .op.ok{border-color:var(--ok);background:#e6f7ec}
.mcq .op.bad{border-color:var(--bad);background:#fdeaea}
.mcq .ex{display:none;font-size:14px;background:#f4f8ff;border-radius:8px;padding:7px 9px;margin-top:6px}
.mcq.done .ex{display:block}
.score{position:sticky;top:0;z-index:5;background:#1e3c8f;color:#fff;border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.rock{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rock button{min-width:46px}
.out{font-weight:800;font-size:16px;background:#e9f8ef;border-radius:10px;padding:8px 10px;margin-top:6px;min-height:42px}
.status{font-weight:800;border-radius:10px;padding:8px 10px;margin-top:6px}
#hud{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
#hud b{background:rgba(0,0,0,.55);color:#7CFFB2;font:800 18px 'Noto Sans',monospace;padding:2px 8px;border-radius:8px;width:max-content}
#hud span{background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:1px 7px;border-radius:6px;width:max-content}
#v3alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(200,16,46,.92);color:#fff;font-weight:800;font-size:18px;padding:12px 16px;border-radius:14px;text-align:center;display:none;max-width:86%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#v3alert.ok{background:rgba(20,164,77,.92)}
.segs{display:flex;gap:6px;margin-top:10px}.seg{flex:1;padding:10px 6px}
.mpane{display:none;margin-top:8px}.mpane.on{display:block}
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bigbtn{background:radial-gradient(circle at 35% 30%,#ff7b6e,#c8102e 70%);color:#fff;border:5px solid #ffd2cc;border-radius:50%;width:116px;height:116px;font:inherit;font-weight:800;font-size:18px;box-shadow:0 8px 18px rgba(200,16,46,.45);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.bigbtn small{font-size:11px;font-weight:600}
.bigbtn.on{transform:scale(.94);box-shadow:0 0 0 10px rgba(255,90,78,.25)}
.handrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#dial{width:180px;height:180px;touch-action:none;cursor:grab;border-radius:50%;background:radial-gradient(#f8fbff,#dfe7f2)}
.flyread{font-weight:800;font-size:17px;background:#14213d;color:#7CFFB2;border-radius:10px;padding:8px 10px;font-family:'Noto Sans Gujarati','Noto Sans',monospace}
.mcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mcards .mcard{flex:0 0 140px}
#cylStrip{position:absolute;left:0;right:0;top:6px;display:flex;gap:4px;justify-content:center;pointer-events:none;padding:0 6px}
#cylStrip span{flex:1;max-width:120px;text-align:center;color:#fff;font-size:11px;font-weight:800;border-radius:7px;padding:2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s}
#cylStrip span.fire{transform:scale(1.12);box-shadow:0 0 12px #ff8a2a}
.mcard{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fafcff;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.mcard b{display:block;font-size:14px}.mcard .st{color:#f2a900;font-size:16px;letter-spacing:2px}
.mcard.on{border-color:var(--pri);background:#eef4ff}
.mbox{border:2px solid var(--pri);border-radius:14px;padding:10px;margin-top:10px;background:#fff}
.mbox h3{margin:0 0 6px}
.goal{background:#f4f8ff;border-radius:10px;padding:8px 10px;font-size:14px}
.vchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.vchip{border:2px solid var(--line);border-radius:10px;padding:6px 2px;font:inherit;font-weight:800;background:#fff;cursor:pointer;color:var(--ink);font-size:13px}
.vchip.sel{border-color:var(--pri);background:#eef4ff}.vchip.ok{border-color:var(--ok);background:#e6f7ec}
.pipes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pipes button{padding:10px 2px}
.sw{font-size:22px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:14px 0 16px}
ol,ul{padding-left:22px;margin:6px 0}
li{margin:3px 0}
.k{font-weight:800;color:#1e3c8f}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="hrow">
  <div><h1 data-t="title"></h1><div class="sub" data-t="sub"></div></div>
  <div class="tools">
   <button data-lang="gu">ગુજ</button><button data-lang="hi">हिं</button><button data-lang="en">EN</button>
   <button id="fsBtn"></button>
  </div>
 </div>
</header>
<div class="remind" id="remind"></div>
<nav class="tabs" id="tabs">
 <button data-tab="p3d" class="on" data-t="tab3d"></button>
 <button data-tab="p2d" data-t="tab2d"></button>
 <button data-tab="ptd" data-t="tabtd"></button>
 <button data-tab="pfo" data-t="tabfo"></button>
 <button data-tab="ppr" data-t="tabpr"></button>
 <button data-tab="pth" data-t="tabth"></button>
 <button data-tab="pmcq" data-t="tabmcq"></button>
</nav>

<!-- 2D -->
<section class="pane" id="p2d">
 <div class="card">
  <h2 data-t="h2d"></h2>
  <div class="ctrl" style="margin-top:0">
   <button class="btn mode" data-mode="act" data-t="modeAct"></button>
   <button class="btn mode" data-mode="th" data-t="modeTh"></button>
  </div>
  <div class="grid2" style="margin-top:8px">
   <div>
    <div class="cvbox"><canvas id="c2d" width="320" height="420"></canvas></div>
   </div>
   <div>
    <div class="cvbox"><canvas id="cSp" width="380" height="400"></canvas></div>
    <div class="legend" id="legend1"></div>
    <div class="read">
     <div><span data-t="rAngle"></span><b id="rA">0°</b></div>
     <div><span data-t="rCam"></span><b id="rC">0°</b></div>
     <div><span data-t="rStroke"></span><b id="rS"></b></div>
     <div><span data-t="rPos"></span><b id="rP"></b></div>
     <div><span data-t="rIn"></span><b id="rI"></b></div>
     <div><span data-t="rEx"></span><b id="rE"></b></div>
    </div>
   </div>
  </div>
  <div class="ctrl">
   <button class="btn pri playBtn"></button>
   <span data-t="speed" style="font-weight:700"></span>
   <span class="spdset"></span>
  </div>
  <input type="range" class="thSlider" min="0" max="719" step="1" value="0">
  <div class="ctrl">
   <button class="btn sm step" data-d="-5">−5°</button><button class="btn sm step" data-d="-1">−1°</button><button class="btn sm step" data-d="1">+1°</button><button class="btn sm step" data-d="5">+5°</button>
  </div>
  <div class="ctrl" id="jumps"><span data-t="jump" style="font-weight:700"></span></div>
  <div class="explain" id="explain"></div>
 </div>
 <div class="card">
  <h2 data-t="gearTitle"></h2>
  <div class="cvbox"><canvas id="cGear" width="320" height="150"></canvas></div>
  <p data-t="gearNote" style="margin:6px 0 0;font-size:14px"></p>
 </div>
</section>

<!-- 3D -->
<section class="pane on" id="p3d">
 <div class="card">
  <h2 data-t="h3d"></h2>
  <div id="v3wrap"><canvas id="v3"></canvas><div id="v3lab"></div><div id="cylStrip"><span id="cs1"></span><span id="cs2"></span><span id="cs3"></span><span id="cs4"></span></div>
   <div id="hud"><b id="hudRpm">0 rpm</b><span id="hudFly"></span><span id="hudSlow"></span></div>
   <div id="v3fire"></div><div id="v3hint" data-t="hint3d"></div><div id="v3msg"></div><div id="v3alert"></div>
  </div>
  <div class="ctrl">
   <button class="btn sm" id="tgSnd"></button><button class="btn sm" id="tgHap"></button><button class="btn sm" id="tgLab" data-t="tgLab"></button>
   <button class="btn sm view" data-v="iso" data-t="vIso"></button><button class="btn sm view" data-v="front" data-t="vFront"></button><button class="btn sm view" data-v="side" data-t="vSide"></button><button class="btn sm view" data-v="top" data-t="vTop"></button><button class="btn sm view" data-v="valve" data-t="vValve"></button>
  </div>
  <div class="segs">
   <button class="btn seg" data-m="run" data-t="segRun"></button><button class="btn seg" data-m="hand" data-t="segHand"></button><button class="btn seg" data-m="mis" data-t="segMis"></button>
  </div>
  <div id="pRun" class="mpane">
   <div class="startrow">
    <button id="startBtn" class="bigbtn"><span>🔑 START</span><small data-t="holdTxt"></small></button>
    <div style="flex:1;min-width:170px">
     <button id="stopBtn" class="btn" style="width:100%;margin-bottom:8px">⏹ STOP</button>
     <div class="sl"><span>⛽ Throttle</span><input type="range" id="thr" min="750" max="2400" step="10" value="750"><span id="thrV">750</span></div>
     <div class="ctrl" id="slowSet"></div>
    </div>
   </div>
   <div class="fochips" id="fo3"></div>
   <div class="status" id="runStat"></div>
   <div class="legend" id="legend2"></div>
   <div class="tip" data-t="note3d"></div>
  </div>
  <div id="pHand" class="mpane">
   <div class="handrow">
    <canvas id="dial" data-fixed="1" width="180" height="180"></canvas>
    <div style="flex:1;min-width:160px">
     <div class="flyread" id="handRead"></div>
     <div class="ctrl"><button class="btn sm hstep" data-d="1">+1°</button><button class="btn sm hstep" data-d="10">+10°</button><button class="btn sm hstep" data-d="90">+90°</button><button class="btn sm hstep" data-d="180">+180°</button></div>
     <p style="margin:6px 0 2px;font-weight:700" data-t="rockChk"></p>
     <div class="ctrl" id="rockChkBtns" style="margin-top:0"></div>
    </div>
   </div>
   <div class="status" id="handStat"></div>
  </div>
  <div id="pMis" class="mpane">
   <div id="misList"></div>
   <div id="misBox"></div>
  </div>
 </div>
</section>

<!-- Timing diagram -->
<section class="pane" id="ptd">
 <div class="card">
  <h2 data-t="htd"></h2>
  <div class="ctrl" style="margin-top:0" id="presets"></div>
  <div class="grid2">
   <div class="fig" id="tdFig"></div>
   <div>
    <p data-t="tdChange" style="margin:0 0 6px;font-weight:700"></p>
    <div id="tdSliders"></div>
    <div class="res" id="tdRes"></div>
   </div>
  </div>
  <p data-t="tdTap" style="margin:8px 0 0;font-weight:700"></p>
  <div class="evchips" id="evchips"></div>
  <div class="explain" id="evExplain"></div>
 </div>
 <div class="card" id="tdDraw"></div>
</section>

<!-- Firing order -->
<section class="pane" id="pfo">
 <div class="card">
  <h2 data-t="hfo"></h2>
  <div class="ctrl" style="margin-top:0" id="engSel"></div>
  <div class="fochips" id="foChips"></div>
  <div id="foInfo" class="formula"></div>
  <div class="cvbox"><canvas id="cRow" width="340" height="210"></canvas></div>
  <div class="ctrl">
   <button class="btn pri playBtn"></button>
   <span data-t="speed" style="font-weight:700"></span>
   <span class="spdset"></span>
  </div>
  <input type="range" class="thSlider" min="0" max="719" step="1" value="0">
  <h3 data-t="foChart"></h3>
  <div class="tw" id="foChart"></div>
  <div class="legend" id="legend3"></div>
 </div>
 <div class="card" id="foText"></div>
</section>

<!-- Practical -->
<section class="pane" id="ppr">
 <div class="card">
  <h2 data-t="hRock"></h2>
  <p data-t="rockIntro" style="margin:0"></p>
  <div class="ctrl" id="rockEng"></div>
  <div class="rock" id="rockBtns"></div>
  <div class="out" id="rockOut"></div>
  <div class="tw" id="rockTbl"></div>
 </div>
 <div class="card">
  <h2 data-t="hClr"></h2>
  <div class="ctrl" style="margin-top:0">
   <button class="btn vsel" data-v="in" data-t="vIn"></button>
   <button class="btn vsel" data-v="ex" data-t="vEx"></button>
  </div>
  <div class="cvbox"><canvas id="cClr" width="320" height="190"></canvas></div>
  <div class="sl" style="margin-top:6px"><span data-t="screw"></span><input type="range" id="gapSl" min="5" max="60" value="12"><span id="gapV"></span></div>
  <div class="ctrl"><button class="btn pri" id="lockBtn" data-t="lockBtn"></button></div>
  <div class="status" id="clrStat"></div>
 </div>
 <div id="prText"></div>
</section>

<!-- Theory -->
<section class="pane" id="pth"><div id="thText"></div></section>

<!-- MCQ -->
<section class="pane" id="pmcq">
 <div class="score"><span id="scoreTxt"></span><button class="btn sm" id="mcqReset" data-t="reset"></button></div>
 <div id="mcqList"></div>
</section>

const EX={
ov:{t:['બંને વાલ્વ ખુલ્લા — Valve Overlap','दोनों वाल्व खुले — Valve Overlap','Both valves open — valve overlap'],b:['Piston TDC પાસે છે. Exhaust વાલ્વ હજુ બંધ થયો નથી અને Inlet વાલ્વ ખૂલી ગયો છે. ઝડપથી બહાર જતો ધુમાડો તાજી હવાને અંદર ખેંચે છે અને સિલિન્ડર સાફ કરે છે (scavenging). આ વખતે rocker arm હીંચકાની જેમ હલે — તેને "rocking" કહે છે.','Piston TDC के पास है। Exhaust वाल्व अभी बंद नहीं हुआ और Inlet वाल्व खुल गया है। तेज़ी से बाहर जाता धुआँ ताज़ी हवा को अंदर खींचता है और सिलेंडर साफ करता है (scavenging)। इस समय rocker arm झूले की तरह हिलता है — इसे "rocking" कहते हैं।','The piston is near TDC. The exhaust valve has not closed yet and the inlet valve has already opened. Fast-leaving exhaust gas pulls fresh air in and cleans the cylinder (scavenging). The rocker arms see-saw here — this is called "rocking".']},
ivlead:{t:['Inlet વાલ્વ વહેલો ખૂલ્યો (IVO — BTDC)','Inlet वाल्व जल्दी खुला (IVO — BTDC)','Inlet opened early (IVO — BTDC)'],b:['Piston હજુ TDC પર પહોંચ્યો નથી, છતાં Inlet વાલ્વ ખૂલવા લાગ્યો. વાલ્વ પૂરો ખૂલતાં સમય લાગે છે, તેથી વહેલો ખોલીએ.','Piston अभी TDC पर नहीं पहुँचा, फिर भी Inlet वाल्व खुलने लगा। वाल्व पूरा खुलने में समय लगता है, इसलिए जल्दी खोलते हैं।','The piston has not reached TDC yet, but the inlet valve starts opening. A valve takes time to open fully, so we open it early.']},
evlag:{t:['Exhaust વાલ્વ મોડો બંધ (EVC — ATDC)','Exhaust वाल्व देर से बंद (EVC — ATDC)','Exhaust closes late (EVC — ATDC)'],b:['Piston TDC વટાવી નીચે જવા લાગ્યો, છતાં Exhaust વાલ્વ હજુ ખુલ્લો — બાકી રહેલો બળેલો ગેસ પણ બહાર નીકળી જાય.','Piston TDC पार करके नीचे जाने लगा, फिर भी Exhaust वाल्व खुला — बचा हुआ जला गैस भी बाहर निकल जाए।','The piston has passed TDC and is going down, yet the exhaust valve is still open — so the last burnt gas also leaves.']},
suc:{t:['સક્શન સ્ટ્રોક (Suction)','सक्शन स्ट्रोक (Suction)','Suction stroke'],b:['Piston TDC થી BDC તરફ નીચે જાય છે. Inlet વાલ્વ ખુલ્લો, Exhaust બંધ. ડીઝલ એન્જિનમાં ફક્ત તાજી હવા અંદર ખેંચાય છે (ઇંધણ નહીં).','Piston TDC से BDC की ओर नीचे जाता है। Inlet वाल्व खुला, Exhaust बंद। डीज़ल इंजन में केवल ताज़ी हवा अंदर खिंचती है (ईंधन नहीं)।','The piston moves down from TDC to BDC. Inlet open, exhaust closed. A diesel engine draws in only fresh air (no fuel).']},
ivlag:{t:['Inlet વાલ્વ મોડો બંધ (IVC — ABDC)','Inlet वाल्व देर से बंद (IVC — ABDC)','Inlet closes late (IVC — ABDC)'],b:['Piston BDC વટાવી ઉપર જવા લાગ્યો, છતાં Inlet વાલ્વ ખુલ્લો છે! કારણ: અંદર ધસતી હવામાં વેગ (inertia) હોય છે, તે ધક્કાથી હજુ અંદર આવતી રહે છે. વધુ હવા = વધુ પાવર.','Piston BDC पार करके ऊपर जाने लगा, फिर भी Inlet वाल्व खुला है! कारण: अंदर आती हवा में वेग (inertia) होता है, वह धक्के से अभी भी अंदर आती रहती है। ज़्यादा हवा = ज़्यादा पावर।','The piston has passed BDC and is rising, but the inlet is still open! Reason: the rushing air has momentum (inertia) and keeps flowing in. More air = more power.']},
comp:{t:['કમ્પ્રેશન સ્ટ્રોક (Compression)','कम्प्रेशन स्ट्रोक (Compression)','Compression stroke'],b:['બંને વાલ્વ બંધ. Piston ઉપર જઈ હવાને દબાવે છે. ડીઝલમાં compression ratio 16:1 થી 22:1 — હવા એટલી ગરમ (લગભગ 500–600°C) થાય કે ડીઝલ જાતે સળગી શકે.','दोनों वाल्व बंद। Piston ऊपर जाकर हवा को दबाता है। डीज़ल में compression ratio 16:1 से 22:1 — हवा इतनी गर्म (लगभग 500–600°C) होती है कि डीज़ल खुद जल सके।','Both valves closed. The piston rises and squeezes the air. Diesel compression ratio is 16:1 to 22:1 — the air gets hot enough (about 500–600°C) to ignite diesel by itself.']},
inj:{t:['ઇન્જેક્શન — TDC પહેલાં (BTDC)','इंजेक्शन — TDC से पहले (BTDC)','Injection — before TDC (BTDC)'],b:['Injector ગરમ હવામાં ડીઝલ ઝીણા ફુવારા રૂપે છાંટે છે. ડીઝલ સળગતાં થોડો સમય લાગે (ignition delay), તેથી TDC પહેલાં જ છાંટવું પડે.','Injector गर्म हवा में डीज़ल बारीक फुहार के रूप में छिड़कता है। डीज़ल जलने में थोड़ा समय लगता है (ignition delay), इसलिए TDC से पहले ही छिड़कना पड़ता है।','The injector sprays diesel as a fine mist into the hot air. Diesel needs a little time to catch fire (ignition delay), so it is sprayed before TDC.']},
pow:{t:['પાવર સ્ટ્રોક (Power) 🔥','पावर स्ट्रोक (Power) 🔥','Power stroke 🔥'],b:['ડીઝલ સળગે છે, ગેસનું દબાણ ખૂબ વધે છે અને piston ને જોરથી નીચે ધકેલે છે. બંને વાલ્વ બંધ. 4 સ્ટ્રોકમાં આ એક જ સ્ટ્રોક કામ (પાવર) આપે છે; બાકીના flywheel ની શક્તિથી ચાલે.','डीज़ल जलता है, गैस का दबाव बहुत बढ़ता है और piston को ज़ोर से नीचे धकेलता है। दोनों वाल्व बंद। 4 स्ट्रोक में यही एक स्ट्रोक काम (पावर) देता है; बाकी flywheel की शक्ति से चलते हैं।','Diesel burns, gas pressure rises sharply and pushes the piston down hard. Both valves closed. Of the 4 strokes only this one gives work; the others run on flywheel energy.']},
evlead:{t:['Exhaust વાલ્વ વહેલો ખૂલ્યો (EVO — BBDC)','Exhaust वाल्व जल्दी खुला (EVO — BBDC)','Exhaust opens early (EVO — BBDC)'],b:['Piston હજુ BDC પહોંચ્યો નથી, છતાં Exhaust વાલ્વ ખૂલ્યો. ગેસમાં હજુ દબાણ છે, તે પોતાની મેળે ધસીને બહાર નીકળી જાય (blow down). તેથી exhaust stroke માં piston ને ઓછી મહેનત પડે.','Piston अभी BDC नहीं पहुँचा, फिर भी Exhaust वाल्व खुला। गैस में अभी दबाव है, वह अपने आप तेज़ी से बाहर निकल जाती है (blow down)। इसलिए exhaust stroke में piston को कम मेहनत पड़ती है।','The piston has not reached BDC, but the exhaust valve opens. The gas still has pressure and rushes out by itself (blow-down), so the piston works less on the exhaust stroke.']},
exh:{t:['એક્ઝોસ્ટ સ્ટ્રોક (Exhaust)','एग्जॉस्ट स्ट्रोक (Exhaust)','Exhaust stroke'],b:['Piston BDC થી TDC તરફ ઉપર જઈ બળેલા ગેસને Exhaust વાલ્વમાંથી બહાર ધકેલે છે. Inlet વાલ્વ બંધ.','Piston BDC से TDC की ओर ऊपर जाकर जले गैस को Exhaust वाल्व से बाहर धकेलता है। Inlet वाल्व बंद।','The piston moves up from BDC to TDC and pushes burnt gas out through the exhaust valve. Inlet closed.']}
};

/* event explanations for timing tab */
const EVX={
IVO:['IVO (Inlet Valve Opens) — TDC પહેલાં. વાલ્વ પૂરો ખૂલતાં સમય લાગે; piston નીચે જવા લાગે ત્યારે રસ્તો પૂરો ખુલ્લો મળે. બહાર જતો exhaust ગેસ નવી હવાને ખેંચે.','IVO (Inlet Valve Opens) — TDC से पहले। वाल्व पूरा खुलने में समय लगता है; piston नीचे जाने लगे तब रास्ता पूरा खुला मिले। बाहर जाती exhaust गैस नई हवा को खींचती है।','IVO (Inlet Valve Opens) — before TDC. The valve needs time to open fully, so the path is wide open when the piston starts down. Leaving exhaust gas also pulls in fresh air.'],
IVC:['IVC (Inlet Valve Closes) — BDC પછી. હવામાં વેગ (inertia) હોવાથી piston ઉપર જવા લાગે છતાં હવા અંદર આવતી રહે. આથી volumetric efficiency અને પાવર વધે.','IVC (Inlet Valve Closes) — BDC के बाद। हवा में वेग (inertia) होने से piston ऊपर जाने लगे फिर भी हवा अंदर आती रहती है। इससे volumetric efficiency और पावर बढ़ते हैं।','IVC (Inlet Valve Closes) — after BDC. The air has momentum, so it keeps entering even as the piston rises. This raises volumetric efficiency and power.'],
EVO:['EVO (Exhaust Valve Opens) — BDC પહેલાં. Power stroke ના છેલ્લા ભાગમાં ધક્કો ઓછો હોય. વહેલો ખોલવાથી દબાણવાળો ગેસ જાતે નીકળી જાય (blow down) અને pumping loss ઘટે.','EVO (Exhaust Valve Opens) — BDC से पहले। Power stroke के आखिरी हिस्से में धक्का कम होता है। जल्दी खोलने से दबाव वाली गैस खुद निकल जाती है (blow down) और pumping loss घटता है।','EVO (Exhaust Valve Opens) — before BDC. The push at the end of the power stroke is small. Opening early lets the pressurised gas blow down by itself and cuts pumping loss.'],
EVC:['EVC (Exhaust Valve Closes) — TDC પછી. બળેલો ગેસ પૂરો બહાર નીકળે (scavenging) અને નીકળતો ગેસ નવી હવાને અંદર ખેંચવામાં મદદ કરે.','EVC (Exhaust Valve Closes) — TDC के बाद। जली गैस पूरी बाहर निकले (scavenging) और निकलती गैस नई हवा को अंदर खींचने में मदद करे।','EVC (Exhaust Valve Closes) — after TDC. All burnt gas gets out (scavenging), and the leaving gas helps pull fresh air in.'],
INJ:['INJ (Injection start) — TDC પહેલાં. ડીઝલ છંટાયા પછી સળગતા સમય લાગે (ignition delay). વહેલું છાંટીએ તો મહત્તમ દબાણ TDC પછી તરત મળે.','INJ (Injection start) — TDC से पहले। डीज़ल छिड़कने के बाद जलने में समय लगता है (ignition delay)। जल्दी छिड़कें तो अधिकतम दबाव TDC के तुरंत बाद मिलता है।','INJ (Injection start) — before TDC. Diesel needs time to ignite after spraying (ignition delay). Spraying early gives peak pressure just after TDC.'],
OV:['Valve Overlap — TDC પાસે બંને વાલ્વ સાથે ખુલ્લા. Overlap = IVO + EVC. ડીઝલમાં ઓછો રાખવો પડે કારણ કે TDC પર piston અને વાલ્વ વચ્ચે જગ્યા બહુ ઓછી હોય.','Valve Overlap — TDC के पास दोनों वाल्व साथ खुले। Overlap = IVO + EVC। डीज़ल में कम रखना पड़ता है क्योंकि TDC पर piston और वाल्व के बीच जगह बहुत कम होती है।','Valve overlap — both valves open together near TDC. Overlap = IVO + EVC. Kept small in diesels because there is very little space between piston and valves at TDC.']
};

]}},
{p:['4 સ્ટ્રોકમાં ફક્ત 1 જ power stroke છે. બાકીના 3 સ્ટ્રોક flywheel માં ભરાયેલી શક્તિથી પૂરા થાય છે.','4 स्ट्रोक में केवल 1 ही power stroke है। बाकी 3 स्ट्रोक flywheel में भरी शक्ति से पूरे होते हैं।','Only 1 of the 4 strokes is a power stroke. The other 3 run on energy stored in the flywheel.']},
{note:['આ ટેબલ "પુસ્તકીયું (theoretical)" છે — વાલ્વ બરાબર TDC/BDC પર ખૂલે-બંધ થાય. વાસ્તવિક એન્જિનમાં વાલ્વ થોડા વહેલા ખૂલે અને મોડા બંધ થાય. એ જ "વાલ્વ ટાઈમિંગ" છે. 2D સિમ્યુલેટરમાં બંને બટન દબાવી ફરક જુઓ.','यह टेबल "किताबी (theoretical)" है — वाल्व ठीक TDC/BDC पर खुलते-बंद होते हैं। असली इंजन में वाल्व थोड़ा जल्दी खुलते और देर से बंद होते हैं। यही "वाल्व टाइमिंग" है। 2D सिम्युलेटर में दोनों बटन दबाकर फर्क देखें।','This table is "theoretical" — valves open and close exactly at TDC/BDC. In a real engine valves open a little early and close a little late. That is "valve timing". Try both buttons in the 2D simulator.']}
]},
{t:['3. વાલ્વ કોણ ખોલે છે? — વાલ્વ મિકેનિઝમ','3. वाल्व कौन खोलता है? — वाल्व मैकेनिज़्म','3. What opens the valves? — valve mechanism'],b:[
{fig:'F2'},
{h:['OHV (Push rod) સિસ્ટમ','OHV (Push rod) सिस्टम','OHV (push-rod) system']},
{p:['Camshaft (block માં) → Tappet / Follower → Push rod → Rocker arm → Valve. Cam નું lobe tappet ને ઉપર ધકેલે, push rod rocker ના એક છેડાને ઉપર કરે, rocker બીજો છેડો નીચે દબાવે અને વાલ્વ ખૂલે. Valve spring વાલ્વને પાછો બંધ કરે. ટ્રક-બસ-ટ્રેક્ટરના ઘણાં ડીઝલ એન્જિનમાં આ સિસ્ટમ હોય છે.','Camshaft (block में) → Tappet / Follower → Push rod → Rocker arm → Valve। Cam का lobe tappet को ऊपर धकेलता है, push rod rocker के एक सिरे को ऊपर करता है, rocker दूसरा सिरा नीचे दबाता है और वाल्व खुलता है। Valve spring वाल्व को वापस बंद करता है। ट्रक-बस-ट्रैक्टर के कई डीज़ल इंजनों में यह सिस्टम होता है।','Camshaft (in the block) → tappet/follower → push rod → rocker arm → valve. The cam lobe lifts the tappet, the push rod lifts one end of the rocker, the rocker pushes the other end down and the valve opens. The valve spring closes it again. Common on truck, bus and tractor diesels.']},
{h:['OHC / DOHC સિસ્ટમ','OHC / DOHC सिस्टम','OHC / DOHC system']},
{p:['Camshaft head ઉપર હોય. Cam સીધો bucket tappet અથવા rocker ને દબાવે — push rod નથી, તેથી વજન ઓછું અને ઊંચી rpm માટે સારું. DOHC = 2 camshaft (એક inlet માટે, એક exhaust માટે). આ લેબનું 3D એન્જિન OHV (push rod) છે — ટ્રક-બસ-ટ્રેક્ટર જેવું.','Camshaft head के ऊपर होता है। Cam सीधे bucket tappet या rocker को दबाता है — push rod नहीं, इसलिए वज़न कम और ऊँची rpm के लिए अच्छा। DOHC = 2 camshaft (एक inlet के लिए, एक exhaust के लिए)। इस लैब का 3D इंजन OHV (push rod) है — ट्रक-बस-ट्रैक्टर जैसा।','The camshaft sits on the head and presses a bucket tappet or rocker directly — no push rod, so less weight and better at high rpm. DOHC = 2 camshafts (one for inlet, one for exhaust). This lab\'s 3D engine is OHV (push rod) — like truck, bus and tractor engines.']},
{h:['મુખ્ય ભાગો','मुख्य भाग','Main parts']},
{ul:[
['Cam lobe: base circle પર વાલ્વ બંધ, nose (ટોચ) પર વાલ્વ પૂરો ખુલ્લો. Lobe નો આકાર જ ટાઈમિંગ અને lift નક્કી કરે.','Cam lobe: base circle पर वाल्व बंद, nose (टोपी) पर वाल्व पूरा खुला। Lobe का आकार ही टाइमिंग और lift तय करता है।','Cam lobe: valve closed on the base circle, fully open at the nose. The lobe shape decides timing and lift.'],
['Valve: head, face (સામાન્ય રીતે 45° અથવા 30°), stem. Inlet valve નું head મોટું હોય (વધુ હવા માટે).','Valve: head, face (आम तौर पर 45° या 30°), stem। Inlet valve का head बड़ा होता है (ज़्यादा हवा के लिए)।','Valve: head, face (usually 45° or 30°), stem. The inlet valve head is bigger (for more air).'],
['Valve seat, valve guide, valve spring, spring retainer અને collet (cotter).','Valve seat, valve guide, valve spring, spring retainer और collet (cotter)।','Valve seat, valve guide, valve spring, spring retainer and collets (cotters).'],
['Rocker arm + adjusting screw + lock nut — અહીંથી valve clearance સેટ થાય.','Rocker arm + adjusting screw + lock nut — यहाँ से valve clearance सेट होता है।','Rocker arm + adjusting screw + lock nut — valve clearance is set here.']
]},
{h:['Camshaft અડધી ઝડપે કેમ?','Camshaft आधी गति से क्यों?','Why does the camshaft turn at half speed?']},
{p:['એક cycle માં crank 2 ચક્કર ફરે, પણ દરેક વાલ્વ cycle માં ફક્ત 1 જ વખત ખૂલવો જોઈએ. તેથી camshaft 1 ચક્કર = crank 2 ચક્કર. Cam gear (કે sprocket) ના દાંતા crank gear કરતા બમણા હોય.','एक cycle में crank 2 चक्कर घूमता है, पर हर वाल्व cycle में केवल 1 बार खुलना चाहिए। इसलिए camshaft 1 चक्कर = crank 2 चक्कर। Cam gear (या sprocket) के दाँते crank gear से दोगुने होते हैं।','In one cycle the crank turns twice, but each valve must open only once. So 1 camshaft turn = 2 crank turns. The cam gear (or sprocket) has twice as many teeth as the crank gear.']},
{f:'Crank speed : Cam speed = 2 : 1     (e.g. 2000 rpm : 1000 rpm)'}
]},
{t:['4. વાલ્વ ટાઈમિંગ એટલે શું? (Lead અને Lag)','4. वाल्व टाइमिंग क्या है? (Lead और Lag)','4. What is valve timing? (lead and lag)'],b:[
{note:['વ્યાખ્યા: Inlet અને Exhaust વાલ્વ, crankshaft ના કેટલા ડિગ્રી પર (TDC/BDC ના સંદર્ભે) ખૂલે અને બંધ થાય — તેને વાલ્વ ટાઈમિંગ કહે છે.','परिभाषा: Inlet और Exhaust वाल्व, crankshaft के कितने डिग्री पर (TDC/BDC के संदर्भ में) खुलते और बंद होते हैं — इसे वाल्व टाइमिंग कहते हैं।','Definition: the crank angles (measured from TDC/BDC) at which the inlet and exhaust valves open and close are called valve timing.']},
{p:['4 ઘટનાઓ છે: IVO (Inlet Valve Opens), IVC (Inlet Valve Closes), EVO (Exhaust Valve Opens), EVC (Exhaust Valve Closes).','4 घटनाएँ हैं: IVO (Inlet Valve Opens), IVC (Inlet Valve Closes), EVO (Exhaust Valve Opens), EVC (Exhaust Valve Closes)।','There are 4 events: IVO (Inlet Valve Opens), IVC (Inlet Valve Closes), EVO (Exhaust Valve Opens), EVC (Exhaust Valve Closes).']},
{tb:{h:[['ઘટના','घटना','Event'],['ક્યારે?','कब?','When?'],['કેમ? (સાદું કારણ)','क्यों? (सरल कारण)','Why? (simple reason)']],r:[
['IVO',['TDC પહેલાં (BTDC) — Lead','TDC से पहले (BTDC) — Lead','Before TDC (BTDC) — lead'],['વાલ્વ પૂરો ખૂલતાં સમય લાગે; piston નીચે જાય ત્યારે રસ્તો તૈયાર હોય.','वाल्व पूरा खुलने में समय लगता है; piston नीचे जाए तब रास्ता तैयार हो।','A valve needs time to open; the path is ready when the piston goes down.']],
['IVC',['BDC પછી (ABDC) — Lag','BDC के बाद (ABDC) — Lag','After BDC (ABDC) — lag'],['હવાનો વેગ (inertia) — હવા હજુ અંદર ધસે છે. વધુ હવા = વધુ પાવર.','हवा का वेग (inertia) — हवा अभी भी अंदर आती है। ज़्यादा हवा = ज़्यादा पावर।','Air momentum (inertia) keeps it flowing in. More air = more power.']],
['EVO',['BDC પહેલાં (BBDC) — Lead','BDC से पहले (BBDC) — Lead','Before BDC (BBDC) — lead'],['દબાણવાળો ગેસ જાતે નીકળી જાય (blow down); piston ને ઓછી મહેનત.','दबाव वाली गैस खुद निकल जाती है (blow down); piston को कम मेहनत।','Pressurised gas blows down by itself; less work for the piston.']],
['EVC',['TDC પછી (ATDC) — Lag','TDC के बाद (ATDC) — Lag','After TDC (ATDC) — lag'],['બધો બળેલો ગેસ નીકળી જાય (scavenging), નવી હવા ખેંચાય.','सारी जली गैस निकल जाए (scavenging), नई हवा खिंचे।','All burnt gas leaves (scavenging) and fresh air is drawn in.']]
]}},
{tip:['યાદ રાખો: "ખોલવામાં વહેલું (Lead), બંધ કરવામાં મોડું (Lag)" — બંને વાલ્વ માટે સરખો નિયમ.','याद रखें: "खोलने में जल्दी (Lead), बंद करने में देर (Lag)" — दोनों वाल्व के लिए एक ही नियम।','Remember: "open early (lead), close late (lag)" — same rule for both valves.']},
{p:['વાલ્વ ટાઈમિંગનો હેતુ: (1) સિલિન્ડરમાં વધુમાં વધુ હવા ભરવી (volumetric efficiency), (2) બળેલો ગેસ પૂરો કાઢવો, (3) pumping loss ઘટાડવો, (4) વધુ પાવર અને ઓછો ધુમાડો.','वाल्व टाइमिंग का उद्देश्य: (1) सिलेंडर में ज़्यादा से ज़्यादा हवा भरना (volumetric efficiency), (2) जली गैस पूरी निकालना, (3) pumping loss घटाना, (4) ज़्यादा पावर और कम धुआँ।','Purpose: (1) fill the cylinder with maximum air (volumetric efficiency), (2) remove all burnt gas, (3) reduce pumping loss, (4) more power and less smoke.']}
]},
{t:['5. વાલ્વ ટાઈમિંગ ડાયાગ્રામ — આંકડા, ગણતરી અને દોરવાની રીત','5. वाल्व टाइमिंग डायग्राम — अंक, गणना और बनाने का तरीका','5. Valve timing diagram — figures, calculation and how to draw'],b:[
{fig:'F3'},
{tb:{h:[['ઘટના','घटना','Event'],['Typical રેન્જ (ડીઝલ)','Typical रेंज (डीज़ल)','Typical range (diesel)'],['આ લેબમાં','इस लैब में','In this lab']],r:[
['IVO','5° – 25° BTDC','10° BTDC'],['IVC','25° – 50° ABDC','40° ABDC'],['EVO','30° – 50° BBDC','40° BBDC'],['EVC','5° – 20° ATDC','10° ATDC'],[['Injection શરૂ','Injection शुरू','Injection start'],'10° – 25° BTDC','15° BTDC']
]}},
{note:['આ typical training figures છે. દરેક એન્જિનના સાચા આંકડા માટે હંમેશાં મેન્યુફેક્ચરરનું manual જુઓ.','ये typical training figures हैं। हर इंजन के सही अंक के लिए हमेशा मैन्युफैक्चरर का manual देखें।','These are typical training figures. Always follow the manufacturer\'s manual for the actual engine.']},
{h:['ગણતરી (પરીક્ષામાં પૂછાય)','गणना (परीक्षा में पूछी जाती है)','Calculations (asked in exams)']},
{f:'Inlet open period   = IVO + 180° + IVC = 10 + 180 + 40 = 230°'},
{f:'Exhaust open period = EVO + 180° + EVC = 40 + 180 + 10 = 230°'},
{f:'Valve overlap       = IVO + EVC = 10 + 10 = 20°'},
{f:'Effective compression = 180° − IVC = 140°    Effective power = 180° − EVO = 140°'},
{h:['ડાયાગ્રામ દોરવાની રીત (સ્ટેપ બાય સ્ટેપ)','डायग्राम बनाने का तरीका (स्टेप बाय स्टेप)','How to draw it (step by step)']},
{ol:[
['એક વર્તુળ દોરો. ઉપર TDC, નીચે BDC લખો અને વચ્ચે ઊભી લાઈન દોરો.','एक वृत्त बनाएँ। ऊपर TDC, नीचे BDC लिखें और बीच में खड़ी रेखा खींचें।','Draw a circle. Write TDC at the top, BDC at the bottom and draw a vertical line.'],
['Crank ફરવાની દિશા (clockwise) તીરથી બતાવો.','Crank घूमने की दिशा (clockwise) तीर से दिखाएँ।','Show crank rotation (clockwise) with an arrow.'],
['TDC ની ડાબી બાજુ IVO નો ખૂણો (10°) protractor થી માપીને નિશાન કરો.','TDC के बाईं ओर IVO का कोण (10°) protractor से नापकर निशान करें।','Mark IVO (10°) to the left of TDC with a protractor.'],
['ત્યાંથી ગોળ ફરતા BDC વટાવીને IVC (40° ABDC) સુધી arc દોરો — આ સક્શન.','वहाँ से गोल घूमते हुए BDC पार करके IVC (40° ABDC) तक arc बनाएँ — यह सक्शन।','From there draw an arc past BDC up to IVC (40° ABDC) — this is suction.'],
['IVC થી TDC સુધી કમ્પ્રેશન. TDC પહેલાં Injection (15° BTDC) નું નિશાન કરો.','IVC से TDC तक कम्प्रेशन। TDC से पहले Injection (15° BTDC) का निशान करें।','From IVC to TDC is compression. Mark injection (15° BTDC) before TDC.'],
['TDC થી EVO (40° BBDC) સુધી પાવર.','TDC से EVO (40° BBDC) तक पावर।','From TDC to EVO (40° BBDC) is power.'],
['EVO થી BDC વટાવી, TDC પછી EVC (10° ATDC) સુધી એક્ઝોસ્ટ.','EVO से BDC पार करके, TDC के बाद EVC (10° ATDC) तक एग्जॉस्ट।','From EVO, past BDC, to EVC (10° ATDC) is exhaust.'],
['TDC પાસે IVO અને EVC વચ્ચેનો ભાગ shade કરો અને "Valve overlap 20°" લખો.','TDC के पास IVO और EVC के बीच का भाग shade करें और "Valve overlap 20°" लिखें।','Shade the part between IVO and EVC near TDC and write "valve overlap 20°".'],
['crank 2 ચક્કર ફરે છે, તેથી arcs ને spiral (અંદર-અંદર) દોરો જેથી એકબીજા પર ન ચડે. દરેક બિંદુ પાસે નામ અને ડિગ્રી લખો.','crank 2 चक्कर घूमता है, इसलिए arcs को spiral (अंदर-अंदर) बनाएँ ताकि एक-दूसरे पर न चढ़ें। हर बिंदु के पास नाम और डिग्री लिखें।','The crank turns twice, so draw the arcs as a spiral (moving inward) so they do not overlap. Write the name and degrees at each point.']
]}
]},
{t:['6. Valve Overlap અને "Rocking"','6. Valve Overlap और "Rocking"','6. Valve overlap and "rocking"'],b:[
{p:['Exhaust stroke ના અંતે અને Suction ની શરૂઆતમાં, TDC પાસે થોડા ડિગ્રી સુધી Inlet અને Exhaust બંને વાલ્વ ખુલ્લા રહે છે — તેને Valve Overlap કહે છે.','Exhaust stroke के अंत और Suction की शुरुआत में, TDC के पास कुछ डिग्री तक Inlet और Exhaust दोनों वाल्व खुले रहते हैं — इसे Valve Overlap कहते हैं।','At the end of exhaust and the start of suction, both valves stay open for a few degrees near TDC — this is valve overlap.']},
{f:'Valve overlap = IVO (BTDC) + EVC (ATDC)'},
{ul:[
['ફાયદા: બહાર જતો ગેસ તાજી હવાને ખેંચે (scavenging), સિલિન્ડર સાફ થાય, વાલ્વ અને chamber ઠંડા રહે.','फायदे: बाहर जाती गैस ताज़ी हवा को खींचती है (scavenging), सिलेंडर साफ होता है, वाल्व और chamber ठंडे रहते हैं।','Benefits: outgoing gas pulls in fresh air (scavenging), the cylinder is cleaned, valves and chamber stay cooler.'],
['વધારે overlap: ઊંચી rpm પર સારું, પણ ઓછી rpm પર ગેસ પાછો inlet માં જાય — idling ખરાબ, ધુમાડો.','ज़्यादा overlap: ऊँची rpm पर अच्छा, पर कम rpm पर गैस वापस inlet में जाती है — idling खराब, धुआँ।','More overlap: good at high rpm, but at low rpm gas flows back into the inlet — rough idle, smoke.'],
['ડીઝલમાં overlap ઓછો રાખવો પડે: compression ratio ઊંચો, TDC પર piston અને વાલ્વ વચ્ચે જગ્યા બહુ ઓછી. Turbo ડીઝલમાં થોડો વધારે હોઈ શકે.','डीज़ल में overlap कम रखना पड़ता है: compression ratio ऊँचा, TDC पर piston और वाल्व के बीच जगह बहुत कम। Turbo डीज़ल में थोड़ा ज़्यादा हो सकता है।','Diesels keep overlap small: high compression ratio leaves very little space between piston and valves at TDC. Turbo diesels may have a bit more.']
]},
{note:['⚠ Overlap વખતે piston TDC પર હોય છે. ટાઈમિંગ belt/chain એક-બે દાંત ખસી જાય તો વાલ્વ અને piston અથડાઈ શકે (interference engine) — વાલ્વ વળી જાય!','⚠ Overlap के समय piston TDC पर होता है। टाइमिंग belt/chain एक-दो दाँत खिसक जाए तो वाल्व और piston टकरा सकते हैं (interference engine) — वाल्व मुड़ जाता है!','⚠ During overlap the piston is at TDC. If the timing belt/chain jumps a tooth or two, valves can hit the piston (interference engine) — valves bend!']},
{h:['Rocking એટલે શું?','Rocking क्या है?','What is rocking?']},
{p:['Overlap વખતે crank સહેજ આગળ-પાછળ હલાવો તો એક વાલ્વ ખૂલે અને બીજો બંધ થાય — બંને rocker arm હીંચકાની જેમ હલે. તેને "valves on rocking" કહે છે. ત્યારે એ સિલિન્ડર exhaust-TDC પર છે, અને તેનો "જોડીદાર" સિલિન્ડર compression-TDC પર છે — જેના બંને વાલ્વ પૂરા બંધ હોય. ટેપેટ સેટિંગમાં આ જ નિયમ વપરાય (પ્રેક્ટિકલ ટેબ જુઓ).','Overlap के समय crank थोड़ा आगे-पीछे हिलाएँ तो एक वाल्व खुलता है और दूसरा बंद होता है — दोनों rocker arm झूले की तरह हिलते हैं। इसे "valves on rocking" कहते हैं। तब वह सिलेंडर exhaust-TDC पर है, और उसका "जोड़ीदार" सिलेंडर compression-TDC पर है — जिसके दोनों वाल्व पूरे बंद होते हैं। टैपेट सेटिंग में यही नियम लगता है (प्रैक्टिकल टैब देखें)।','During overlap, if you rock the crank slightly, one valve opens while the other closes — both rockers see-saw. This is "valves on rocking". That cylinder is at exhaust-TDC and its partner cylinder is at compression-TDC with both valves fully closed. Tappet setting uses this rule (see the Practical tab).']}
]},
{t:['7. ડીઝલ Injection Timing (અને પેટ્રોલમાં Ignition Timing)','7. डीज़ल Injection Timing (और पेट्रोल में Ignition Timing)','7. Diesel injection timing (and petrol ignition timing)'],b:[
{p:['ડીઝલ એન્જિનમાં spark plug નથી. Injector દ્વારા ડીઝલ compression stroke ના અંતે, TDC પહેલાં છાંટવામાં આવે છે. ડીઝલ છંટાયા પછી સળગતાં થોડો સમય લાગે — તેને "Ignition delay" કહે છે. તેથી injection વહેલું (BTDC) રાખવું પડે, જેથી સૌથી વધુ દબાણ TDC પછી તરત (લગભગ 10°–15° ATDC) મળે.','डीज़ल इंजन में spark plug नहीं होता। Injector द्वारा डीज़ल compression stroke के अंत में, TDC से पहले छिड़का जाता है। डीज़ल छिड़कने के बाद जलने में थोड़ा समय लगता है — इसे "Ignition delay" कहते हैं। इसलिए injection जल्दी (BTDC) रखना पड़ता है, ताकि सबसे ज़्यादा दबाव TDC के तुरंत बाद (लगभग 10°–15° ATDC) मिले।','A diesel has no spark plug. The injector sprays diesel at the end of compression, before TDC. Diesel takes a moment to ignite — the "ignition delay". So injection is advanced (BTDC) to get peak pressure just after TDC (about 10°–15° ATDC).']},
{tb:{h:[['સ્થિતિ','स्थिति','Condition'],['અસર','असर','Effect']],r:[
[['વધુ વહેલું (Advance)','बहुत जल्दी (Advance)','Too early (advance)'],['ખટ-ખટ અવાજ (diesel knock), દબાણ વધુ, એન્જિન ગરમ, piston-bearing પર ભાર, NOx વધે.','खट-खट आवाज़ (diesel knock), दबाव ज़्यादा, इंजन गर्म, piston-bearing पर भार, NOx बढ़े।','Knocking (diesel knock), high pressure, overheating, load on piston and bearings, more NOx.']],
[['મોડું (Retard)','देर से (Retard)','Too late (retard)'],['કાળો ધુમાડો, પાવર ઓછો, ડીઝલ વધુ વપરાય, exhaust ખૂબ ગરમ, સ્ટાર્ટ થવામાં તકલીફ.','काला धुआँ, पावर कम, डीज़ल ज़्यादा खपत, exhaust बहुत गर्म, स्टार्ट होने में दिक्कत।','Black smoke, low power, high fuel use, very hot exhaust, hard starting.']]
]}},
{ul:[
['Speed વધે તેમ injection વહેલું કરવું પડે — inline pump માં automatic timer, rotary pump માં advance device, CRDI માં ECU આ કામ કરે.','Speed बढ़ने पर injection जल्दी करना पड़ता है — inline pump में automatic timer, rotary pump में advance device, CRDI में ECU यह काम करता है।','As speed rises, injection must advance — an automatic timer on inline pumps, an advance device on rotary pumps, and the ECU on CRDI.'],
['FIP ને એન્જિન સાથે timing marks મેળવીને બેસાડાય. Inline pump માં "spill timing" રીતથી સિલિન્ડર 1 નું injection ટાઈમિંગ ચેક થાય.','FIP को इंजन के साथ timing marks मिलाकर लगाया जाता है। Inline pump में "spill timing" विधि से सिलेंडर 1 का injection टाइमिंग चेक होता है।','The FIP is fitted by matching timing marks with the engine. On inline pumps, cylinder 1 injection timing is checked by the "spill timing" method.'],
['પેટ્રોલ એન્જિનમાં તેના બદલે "Ignition timing" હોય — spark plug TDC પહેલાં spark આપે.','पेट्रोल इंजन में इसकी जगह "Ignition timing" होता है — spark plug TDC से पहले spark देता है।','Petrol engines have "ignition timing" instead — the spark plug fires before TDC.']
]}
]},

{note:['વ્યાખ્યા: Multi-cylinder એન્જિનમાં જે ક્રમમાં જુદા જુદા સિલિન્ડરમાં power stroke (ફાયરિંગ) થાય — તેને ફાયરિંગ ઓર્ડર કહે છે. સિલિન્ડર નંબર 1 સામાન્ય રીતે આગળ (timing/fan બાજુ) હોય.','परिभाषा: Multi-cylinder इंजन में जिस क्रम में अलग-अलग सिलेंडरों में power stroke (फायरिंग) होता है — उसे फायरिंग ऑर्डर कहते हैं। सिलेंडर नंबर 1 आम तौर पर आगे (timing/fan की तरफ) होता है।','Definition: the sequence in which power strokes (firing) occur in the cylinders of a multi-cylinder engine is the firing order. Cylinder 1 is usually at the front (timing/fan end).']},
{h:['ફાયરિંગ ઓર્ડર કેમ જરૂરી?','फायरिंग ऑर्डर क्यों ज़रूरी?','Why is a firing order needed?']},
{ul:[
['એન્જિન balance રહે અને ધ્રુજારી (vibration) ઓછી થાય.','इंजन balance रहे और कंपन (vibration) कम हो।','The engine stays balanced with less vibration.'],
['Crankshaft પર ભાર સરખો વહેંચાય — વળવું/મરોડાવું (bending/torsion) ઓછું.','Crankshaft पर भार बराबर बँटे — मुड़ना/मरोड़ (bending/torsion) कम।','Load spreads evenly on the crankshaft — less bending and twisting.'],
['ટોર્ક સરખો મળે, એન્જિન smooth ચાલે.','टॉर्क बराबर मिले, इंजन smooth चले।','Even torque — the engine runs smoothly.'],
['પાસપાસેના સિલિન્ડર સળંગ ન ફાયર થાય — ગરમી સરખી વહેંચાય, main bearing પર ભાર ઓછો.','पास-पास के सिलेंडर लगातार फायर न हों — गर्मी बराबर बँटे, main bearing पर भार कम।','Neighbouring cylinders do not fire one after another — heat spreads evenly and main bearings carry less load.'],
['Inlet manifold માં હવા બધા સિલિન્ડરને સરખી મળે.','Inlet manifold में हवा सभी सिलेंडरों को बराबर मिले।','Air in the inlet manifold reaches all cylinders evenly.']
]},

{fig:'F4'},
{p:['4-સિલિન્ડર crank: 1 અને 4 ના crank pin એક દિશામાં, 2 અને 3 ના 180° સામે. તેથી 1 અને 4 સાથે TDC પર આવે — પણ એક compression-TDC પર હોય ત્યારે બીજો exhaust-TDC (overlap) પર. 6-સિલિન્ડરમાં જોડી 1-6, 2-5, 3-4, દરેક જોડી 120° અંતરે.','4-सिलेंडर crank: 1 और 4 के crank pin एक दिशा में, 2 और 3 के 180° सामने। इसलिए 1 और 4 साथ TDC पर आते हैं — पर एक compression-TDC पर हो तब दूसरा exhaust-TDC (overlap) पर। 6-सिलेंडर में जोड़ी 1-6, 2-5, 3-4, हर जोड़ी 120° अंतर पर।','4-cylinder crank: pins of 1 and 4 point one way, 2 and 3 are 180° opposite. So 1 and 4 reach TDC together — one on compression-TDC while the other is on exhaust-TDC (overlap). In a 6-cylinder the pairs are 1-6, 2-5, 3-4, each pair 120° apart.']},
{tip:['ફાયરિંગ ઓર્ડર એન્જિનની ડિઝાઈનથી નક્કી થાય — મિકેનિક બદલી શકતો નથી. તે manual માં, engine block અથવા inlet manifold પર લખેલો હોય. Injector HP pipe (અથવા spark plug wire) ફાયરિંગ ઓર્ડર પ્રમાણે જ જોડવા.','फायरिंग ऑर्डर इंजन की डिज़ाइन से तय होता है — मैकेनिक बदल नहीं सकता। यह manual में, engine block या inlet manifold पर लिखा होता है। Injector HP pipe (या spark plug wire) फायरिंग ऑर्डर के अनुसार ही जोड़ें।','The firing order is fixed by engine design — a mechanic cannot change it. It is given in the manual or cast on the block/inlet manifold. Connect injector HP pipes (or spark plug leads) strictly in firing order.']}
]},

{p:['Timing marks: crank gear, cam gear અને FIP gear પર punch/dot/arrow; અથવા crank pulley પર "TDC" લાઈન અને timing cover પર pointer. Marks મેળવવાથી વાલ્વ ટાઈમિંગ આપોઆપ સાચું આવે.','Timing marks: crank gear, cam gear और FIP gear पर punch/dot/arrow; या crank pulley पर "TDC" लाइन और timing cover पर pointer। Marks मिलाने से वाल्व टाइमिंग अपने आप सही आता है।','Timing marks: punch marks/dots/arrows on crank, cam and FIP gears; or a "TDC" line on the crank pulley with a pointer on the timing cover. Matching the marks sets the valve timing automatically.']},
{h:['એક દાંત ખસી જાય તો કેટલો ફરક?','एक दाँत खिसक जाए तो कितना फर्क?','How much error from one tooth?']},
{f:'1 tooth error (crank degrees) = 720° ÷ teeth on cam gear'},
{p:['ઉદાહરણ: 40 દાંતાના cam gear માં 1 દાંત ખસે તો 720 ÷ 40 = 18° crank ટાઈમિંગ બદલાઈ જાય! એટલે marks બરાબર મેળવવા જ પડે.','उदाहरण: 40 दाँतों के cam gear में 1 दाँत खिसके तो 720 ÷ 40 = 18° crank टाइमिंग बदल जाती है! इसलिए marks ठीक से मिलाने ही पड़ते हैं।','Example: on a 40-tooth cam gear, one tooth error = 720 ÷ 40 = 18° of crank timing! So marks must match exactly.']}
]},
{t:['11. વાલ્વ ક્લિયરન્સ (ટેપેટ ક્લિયરન્સ)','11. वाल्व क्लीयरेंस (टैपेट क्लीयरेंस)','11. Valve clearance (tappet clearance)'],b:[
{p:['વાલ્વ પૂરો બંધ હોય ત્યારે rocker arm અને valve stem વચ્ચે (અથવા cam અને tappet વચ્ચે) રખાતો નાનો ગેપ. કારણ: એન્જિન ગરમ થાય ત્યારે valve stem લંબાય છે. ગેપ ન હોય તો ગરમ વાલ્વ પૂરો બંધ નહીં થાય.','वाल्व पूरा बंद हो तब rocker arm और valve stem के बीच (या cam और tappet के बीच) रखा जाने वाला छोटा गैप। कारण: इंजन गर्म होने पर valve stem लंबा होता है। गैप न हो तो गर्म वाल्व पूरा बंद नहीं होगा।','A small gap kept between rocker arm and valve stem (or cam and tappet) when the valve is fully closed. Reason: the valve stem grows longer when hot. Without the gap a hot valve would not close fully.']},
{f:'Typical (cold): Inlet 0.20 – 0.30 mm   |   Exhaust 0.30 – 0.45 mm'},
{p:['Exhaust વાલ્વ વધારે ગરમ થાય છે, તેથી તેનું clearance વધારે. (સાચા આંકડા manual પ્રમાણે; કેટલાક એન્જિનમાં ગરમ એન્જિને સેટ થાય.)','Exhaust वाल्व ज़्यादा गर्म होता है, इसलिए उसका clearance ज़्यादा। (सही अंक manual अनुसार; कुछ इंजनों में गर्म इंजन पर सेट होता है।)','The exhaust valve runs hotter, so its clearance is larger. (Use manual values; some engines are set hot.)']},
{tb:{h:[['ક્લિયરન્સ','क्लीयरेंस','Clearance'],['અસર','असर','Effect']],r:[
[['ઓછું','कम','Too small'],['વાલ્વ સીટ પર પૂરો ન બેસે, compression leak, વાલ્વ બળી જાય (burnt valve), પાવર ઓછો, starting તકલીફ.','वाल्व सीट पर पूरा न बैठे, compression leak, वाल्व जल जाए (burnt valve), पावर कम, starting दिक्कत।','Valve does not seat, compression leaks, valve burns, low power, hard starting.']],
[['વધારે','ज़्यादा','Too large'],['ટક-ટક અવાજ (tappet noise), વાલ્વ મોડો ખૂલે-વહેલો બંધ થાય, lift ઓછી, હવા ઓછી, પાવર ઓછો, ઘસારો.','टक-टक आवाज़ (tappet noise), वाल्व देर से खुले-जल्दी बंद हो, lift कम, हवा कम, पावर कम, घिसाव।','Tapping noise, valve opens late and closes early, less lift, less air, less power, wear.']]
]}},
{tip:['Clearance હંમેશાં તે વાલ્વ cam ના base circle પર (પૂરો બંધ) હોય ત્યારે — એટલે કે તે સિલિન્ડર compression-TDC પર હોય ત્યારે માપો. Hydraulic tappet વાળા એન્જિનમાં ગેપ આપોઆપ સેટ રહે.','Clearance हमेशा तब नापें जब वह वाल्व cam के base circle पर (पूरा बंद) हो — यानी वह सिलेंडर compression-TDC पर हो। Hydraulic tappet वाले इंजन में गैप अपने आप सेट रहता है।','Always measure clearance when that valve is on the cam base circle (fully closed) — i.e. that cylinder is on compression-TDC. Engines with hydraulic tappets self-adjust.']}
]},
{t:['12. 2-સ્ટ્રોક એન્જિન — Port Timing (ટૂંકમાં)','12. 2-स्ट्रोक इंजन — Port Timing (संक्षेप में)','12. Two-stroke engine — port timing (brief)'],b:[
{p:['2-સ્ટ્રોક એન્જિનમાં ઘણી વાર વાલ્વને બદલે સિલિન્ડરની દીવાલમાં ports હોય, જે piston પોતે ખોલે-બંધ કરે. એક cycle = crank નું 1 ચક્કર = 360°. Port timing ડાયાગ્રામ BDC ની આસપાસ સમપ્રમાણ (symmetric) હોય: Exhaust port પહેલા ખૂલે (EPO, BBDC), પછી Transfer port ખૂલે (TPO, BBDC); BDC પછી Transfer port બંધ (TPC, ABDC), પછી Exhaust port બંધ (EPC, ABDC). મોટા 2-સ્ટ્રોક ડીઝલ (જહાજ) માં exhaust valve + inlet ports (uniflow scavenging) હોય.','2-स्ट्रोक इंजन में अक्सर वाल्व की जगह सिलेंडर की दीवार में ports होते हैं, जिन्हें piston खुद खोलता-बंद करता है। एक cycle = crank का 1 चक्कर = 360°। Port timing डायग्राम BDC के आसपास सममित (symmetric) होता है: Exhaust port पहले खुलता है (EPO, BBDC), फिर Transfer port (TPO, BBDC); BDC के बाद Transfer port बंद (TPC, ABDC), फिर Exhaust port बंद (EPC, ABDC)। बड़े 2-स्ट्रोक डीज़ल (जहाज़) में exhaust valve + inlet ports (uniflow scavenging) होते हैं।','Two-strokes often use ports in the cylinder wall instead of valves; the piston opens and closes them. One cycle = 1 crank turn = 360°. The port timing diagram is symmetric about BDC: exhaust port opens first (EPO, BBDC), then the transfer port (TPO, BBDC); after BDC the transfer port closes (TPC, ABDC), then the exhaust port (EPC, ABDC). Large marine 2-stroke diesels use an exhaust valve with inlet ports (uniflow scavenging).']}
]},

{t:['A. સાધનો અને સલામતી','A. औज़ार और सुरक्षा','A. Tools and safety'],b:[
{ul:[
['સાધનો: Feeler gauge set, ring/box spanner, screwdriver, socket set, crank ફેરવવાનું tool (barring tool), dial gauge + stand, degree wheel (protractor disc), torch, chalk, મેન્યુફેક્ચરરનું manual.','औज़ार: Feeler gauge set, ring/box spanner, screwdriver, socket set, crank घुमाने का tool (barring tool), dial gauge + stand, degree wheel (protractor disc), torch, chalk, मैन्युफैक्चरर का manual।','Tools: feeler gauge set, ring/box spanners, screwdriver, socket set, crank barring tool, dial gauge with stand, degree wheel, torch, chalk, manufacturer\'s manual.'],
['એન્જિન ઠંડું હોવું જોઈએ (manual માં ગરમ લખ્યું ન હોય તો). બેટરીનો negative કાઢો, ગિયર neutral, વાહનને વ્હીલ ચોક.','इंजन ठंडा होना चाहिए (manual में गर्म न लिखा हो तो)। बैटरी का negative हटाएँ, गियर neutral, वाहन को व्हील चोक।','Engine must be cold (unless the manual says hot). Disconnect battery negative, gear in neutral, chock the wheels.'],
['Crank હંમેશાં એન્જિનની સામાન્ય ફરવાની દિશામાં જ ફેરવો; camshaft bolt થી ન ફેરવો.','Crank हमेशा इंजन की सामान्य घूमने की दिशा में ही घुमाएँ; camshaft bolt से न घुमाएँ।','Always turn the crank in its normal direction of rotation; never turn it by the camshaft bolt.'],

]}
]},
{t:['B. સિલિન્ડર 1 ને Compression TDC પર લાવવો','B. सिलेंडर 1 को Compression TDC पर लाना','B. Bringing cylinder 1 to compression TDC'],b:[
{ol:[
['Rocker cover ખોલો અને timing marks (crank pulley/flywheel) સાફ કરી chalk થી દેખાય તેવા કરો.','Rocker cover खोलें और timing marks (crank pulley/flywheel) साफ करके chalk से दिखने लायक करें।','Remove the rocker cover; clean the timing marks (crank pulley/flywheel) and highlight with chalk.'],
['Crank ને સામાન્ય દિશામાં ધીમે ફેરવો અને સિલિન્ડર 1 ના inlet વાલ્વને ખૂલી-બંધ થતો જુઓ.','Crank को सामान्य दिशा में धीरे घुमाएँ और सिलेंडर 1 के inlet वाल्व को खुलते-बंद होते देखें।','Turn the crank slowly in normal direction and watch cylinder 1 inlet valve open and close.'],
['Inlet બંધ થયા પછી (compression શરૂ) ફેરવતા રહો — TDC mark pointer સામે આવે ત્યાં રોકો.','Inlet बंद होने के बाद (compression शुरू) घुमाते रहें — TDC mark pointer के सामने आए वहाँ रुकें।','After the inlet closes (compression starts), keep turning until the TDC mark meets the pointer.'],
['ખાતરી કરો: સિલિન્ડર 1 ના બંને rocker હાથથી સહેજ ઢીલા (હલે) હોય = compression TDC. જો વાલ્વ rocking હોય તો crank 360° વધુ ફેરવો.','सुनिश्चित करें: सिलेंडर 1 के दोनों rocker हाथ से थोड़े ढीले (हिलें) हों = compression TDC। अगर वाल्व rocking हों तो crank 360° और घुमाएँ।','Check: both rockers of cylinder 1 are slightly loose = compression TDC. If its valves are rocking, turn the crank one more full turn (360°).']
]}
]},
{t:['C. વાલ્વ ક્લિયરન્સ (ટેપેટ) સેટિંગ — સ્ટેપ બાય સ્ટેપ','C. वाल्व क्लीयरेंस (टैपेट) सेटिंग — स्टेप बाय स्टेप','C. Valve clearance (tappet) setting — step by step'],b:[
{ol:[

{tip:['જુઓ: 4-સિલિન્ડરમાં કોઈ પણ સમયે ચારેય સિલિન્ડર જુદા જુદા સ્ટ્રોકમાં હોય છે — એક સક્શન, એક કમ્પ્રેશન, એક પાવર, એક એક્ઝોસ્ટ. તેથી દર 180° એ એક power stroke મળે અને એન્જિન smooth ચાલે. 6-સિલિન્ડરમાં power stroke એકબીજા પર ચડે (overlap) — તેથી તે વધુ smooth.','देखें: 4-सिलेंडर में किसी भी समय चारों सिलेंडर अलग-अलग स्ट्रोक में होते हैं — एक सक्शन, एक कम्प्रेशन, एक पावर, एक एग्जॉस्ट। इसलिए हर 180° पर एक power stroke मिलता है और इंजन smooth चलता है। 6-सिलेंडर में power stroke एक-दूसरे पर चढ़ते हैं (overlap) — इसलिए वह और smooth।','Notice: in a 4-cylinder, at any moment the four cylinders are on four different strokes — suction, compression, power, exhaust. So a power stroke comes every 180° and the engine runs smoothly. In a 6-cylinder the power strokes overlap — even smoother.']}

/* ================= APP ================= */
const LANGS=['gu','hi','en'];
let lang='gu';
try{const s=localStorage.getItem('vtlLang');if(LANGS.includes(s))lang=s;}catch(e){}
const li=()=>LANGS.indexOf(lang);
function tr(x){if(x==null)return'';if(typeof x==='string'||typeof x==='number')return String(x);if(Array.isArray(x))return x[li()]!=null?x[li()]:x[2];return x[lang]||x.en||'';}
const $=id=>document.getElementById(id);
const mod=(a,n)=>((a%n)+n)%n;
const COL={S:'#1558c4',C:'#0e7a3c',P:'#c41e24',E:'#4b525b',I:'#c98600'};

/* ---------- valve timing state ---------- */
const ACT={ivo:10,ivc:40,evo:40,evc:10,inj:15};
const THE={ivo:0,ivc:0,evo:0,evc:0,inj:0};
const PET={ivo:18,ivc:55,evo:50,evc:15,inj:10};
let TV=Object.assign({},ACT);
let theta=0,playing=true,speed=1;
const SPEEDS=[0.1,0.25,0.5,1,2];
const inStart=()=>-TV.ivo, inDur=()=>TV.ivo+180+TV.ivc;
const exStart=()=>540-TV.evo, exDur=()=>TV.evo+180+TV.evc;
const midIn=()=>inStart()+inDur()/2, midEx=()=>exStart()+exDur()/2;
function liftF(a,s,d){const p=mod(a-s,720);return p<d?Math.sin(Math.PI*p/d):0;}
const inLift=a=>liftF(a,inStart(),inDur()), exLift=a=>liftF(a,exStart(),exDur());
const isInOpen=a=>mod(a-inStart(),720)<inDur(), isExOpen=a=>mod(a-exStart(),720)<exDur();
const injOn=a=>mod(a-(360-TV.inj),720)<18;
function burn(a){const p=mod(a-(360-TV.inj+5),720),d=TV.inj+55;if(p>=d)return 0;return p<8?p/8:1-(p-8)/(d-8);}
const strokeOf=a=>{a=mod(a,720);return a<180?'S':a<360?'C':a<540?'P':'E';};
function phaseOf(a){a=mod(a,720);const i=isInOpen(a),e=isExOpen(a),s=strokeOf(a);
 if(i&&e)return'ov';
 if(s==='S')return i?'suc':(e?'evlag':'suc');
 if(s==='C'){if(i)return'ivlag';if(a>=360-TV.inj&&TV.inj>0)return'inj';return'comp';}
 if(s==='P')return e?'evlead':'pow';
 return i?'ivlead':'exh';}

/* ---------- i18n apply ---------- */
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(D[k])el.innerHTML=tr(D[k]);});
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
 updFS();buildLegends();buildJumps();buildSpeeds();updPlay();buildTheory();buildPractical();buildFOText();buildMCQ();buildPresets();buildTDSliders();renderTD();buildEngSel();buildFoChart();buildRock();updClr();buildTdDraw();showRemind(true);
 phaseKey=null;
 lang3();
 sendHSoon();
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('vtlLang',lang);}catch(e){}applyLang();});

/* ---------- fullscreen ---------- */
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains('fsx'));
function updFS(){$('fsBtn').textContent=isFS()?'✕ '+tr(D.fsOff):'⛶ '+tr(D.fsOn);}
$('fsBtn').onclick=()=>{
 const d=document;
 if(isFS()){
  if(d.fullscreenElement&&d.exitFullscreen)d.exitFullscreen().catch(()=>{});
  else if(d.webkitFullscreenElement&&d.webkitExitFullscreen)d.webkitExitFullscreen();
  document.body.classList.remove('fsx');
 }else{
  const el=d.documentElement;
  try{const p=el.requestFullscreen?el.requestFullscreen():(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null);if(p&&p.catch)p.catch(()=>{});}catch(e){}
  setTimeout(()=>{if(!(d.fullscreenElement||d.webkitFullscreenElement))document.body.classList.add('fsx');updFS();resizeAll();},350);
 }
 setTimeout(()=>{updFS();resizeAll();sendHSoon();},120);
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{updFS();resizeAll();sendHSoon();}));

/* ---------- iframe height ---------- */
function sendH(){if(window.parent===window)return;if(isFS())return;const el=$('foot');const h=Math.ceil(el.getBoundingClientRect().bottom+window.scrollY+8);try{window.parent.postMessage({dmHeight:h},'*');}catch(e){}}
let _hT=null;function sendHSoon(){clearTimeout(_hT);_hT=setTimeout(sendH,60);}
window.addEventListener('load',()=>{sendH();setTimeout(sendH,600);});
if(window.ResizeObserver)new ResizeObserver(sendHSoon).observe($('app'));
document.addEventListener('click',()=>setTimeout(sendH,80));

/* ---------- tabs ---------- */
let curTab='p3d';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
 if(curTab==='p3d'&&b.dataset.tab!=='p3d')leave3D();
 curTab=b.dataset.tab;
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===curTab));
 if(curTab==='p3d'){init3D();resize3D();}
 if(curTab==='ptd')renderTD();
 sendHSoon();
});

/* ---------- reminder ticker ---------- */
let remI=0,remT=0;
function showRemind(now){$('remind').innerHTML='💡 '+tr(REM[remI]);}

/* ---------- legends ---------- */
function buildLegends(){
 const h=['S','C','P','E'].map(k=>`<span><i style="background:${COL[k]}"></i>${tr(SN[k])}</span>`).join('')+`<span><i style="background:${COL.I}"></i>${tr(SN.I)}</span>`;
 ['legend1','legend2','legend3'].forEach(id=>$(id).innerHTML=h);
}

/* ---------- controls ---------- */
function updPlay(){document.querySelectorAll('.playBtn').forEach(b=>b.textContent=playing?tr(D.pause):tr(D.play));}
document.querySelectorAll('.playBtn').forEach(b=>b.onclick=()=>{playing=!playing;updPlay();});
function buildSpeeds(){document.querySelectorAll('.spdset').forEach(sp=>{sp.innerHTML=SPEEDS.map(s=>`<button class="btn sm spd${s===speed?' on':''}" data-s="${s}">${s}×</button>`).join(' ');});
 document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;buildSpeeds();if(!playing){playing=true;updPlay();}});}
document.querySelectorAll('.thSlider').forEach(s=>s.addEventListener('input',()=>{theta=+s.value;playing=false;updPlay();}));
document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{theta=mod(mod(theta,720)+(+b.dataset.d),720);playing=false;updPlay();});
function buildJumps(){
 const j=[['TDC',0],['IVO',720-TV.ivo],['BDC',180],['IVC',180+TV.ivc],['INJ',360-TV.inj],['TDC',360],['EVO',540-TV.evo],['BDC',540],['EVC',TV.evc]];
 $('jumps').innerHTML=`<span style="font-weight:700">${tr(D.jump)}</span>`+j.map(x=>`<button class="btn sm jmp" data-a="${mod(x[1],720)}">${x[0]} ${mod(x[1],720)}°</button>`).join('');

function updClr(){
 document.querySelectorAll('.vsel').forEach(b=>b.classList.toggle('on',b.dataset.v===vSel));
 const spec=vSel==='in'?0.25:0.35;$('gapV').textContent=gap.toFixed(2)+' mm';
 const d=gap-spec;let msg,col;
 const L=(g,h,e)=>[g,h,e];
 if(Math.abs(d)<=0.015){msg=L('✅ હળવું ખેંચાણ (slight drag) — clearance બરાબર '+spec.toFixed(2)+' mm','✅ हल्का खिंचाव (slight drag) — clearance सही '+spec.toFixed(2)+' mm','✅ Slight drag — clearance correct at '+spec.toFixed(2)+' mm');col='#e6f7ec';}
 else if(d<0){msg=L('⛔ Feeler '+spec.toFixed(2)+' અંદર જતું નથી / ખૂબ ટાઈટ — ગેપ ઓછો. Screw ઢીલો કરો (ઉલટી દિશામાં ફેરવો).','⛔ Feeler '+spec.toFixed(2)+' अंदर नहीं जाता / बहुत टाइट — गैप कम। Screw ढीला करें (उलटी दिशा में घुमाएँ)।','⛔ The '+spec.toFixed(2)+' feeler will not enter / too tight — gap too small. Back the screw off.');col='#fdeaea';}
 else{msg=L('⚠ Feeler ઢીલું સરકે છે — ગેપ વધારે. Screw કસો.','⚠ Feeler ढीला सरकता है — गैप ज़्यादा। Screw कसें।','⚠ The feeler slides loosely — gap too large. Tighten the screw.');col='#fff4e5';}
 let lk='';if(locked)lk=Math.abs(d)<=0.015?'<br>🔩 '+tr(['Lock nut કસ્યો. હવે ફરી feeler થી ચેક કરો — શાબાશ!','Lock nut कस दिया। अब फिर feeler से चेक करें — शाबाश!','Lock nut tightened. Re-check with the feeler — well done!']):'<br>🔩 '+tr(['ના! પહેલાં ગેપ બરાબર કરો, પછી જ lock કરો.','नहीं! पहले गैप सही करें, फिर ही lock करें।','No! Correct the gap first, then lock.']);

function drawClr(){
 const cv=$('cClr'),c=prepCanvas(cv);c.clearRect(0,0,320,190);const spec=vSel==='in'?0.25:0.35;const g=gap*110;
 // rocker
 c.save();c.translate(70,70);c.rotate(-0.06);c.fillStyle='#5d6d7e';rr(c,0,-10,200,22,8);c.fill();c.restore();
 c.fillStyle='#2c3e50';c.beginPath();c.arc(120,68,9,0,7);c.fill();c.fillStyle='#ecf0f1';c.font='9px Noto Sans,sans-serif';c.fillText('shaft',108,90);

 c.fillStyle='#34495e';c.fillRect(231,stemTop+22,36,5);c.strokeStyle='#2c3e50';c.lineWidth=2;c.beginPath();for(let i=0;i<=10;i++){const y=stemTop+27+i*6;c.lineTo(249+(i%2?14:-14),y);}c.stroke();
 // feeler blade

 c.strokeStyle='#e67e22';c.lineWidth=1;c.beginPath();c.moveTo(268,82);c.lineTo(300,82);c.moveTo(268,82+g);c.lineTo(300,82+g);c.stroke();c.fillStyle='#e67e22';c.font='bold 11px Noto Sans,sans-serif';c.fillText(gap.toFixed(2),282,82+g/2+4>100?82+g/2+4:100);
 c.fillStyle='#555';c.font='10px Noto Sans,sans-serif';c.fillText('Valve stem',150,180);c.fillText('Rocker arm',20,60);c.fillText('(×110 zoom)',20,180);

/* ---------- engine state ---------- */
const FO4=[1,3,4,2], OFF4={1:0,3:180,4:360,2:540}, XC=[-1.8,-0.6,0.6,1.8];
const SPEC=[0.25,0.35];
const EN3={mode:'stop',rpm:0,target:750,slow:20,crankT:0,bent:false,teeth:0,map:{A:1,B:3,C:4,D:2},clr:[.25,.35,.25,.35,.25,.35,.25,.35],inj:0,ui:'run',snd:true,hap:true,shake:0,crashT:0,warn:''};
try{EN3.snd=localStorage.getItem('vtlSnd')!=='0';EN3.hap=localStorage.getItem('vtlHap')!=='0';}catch(e){}
const OUT=['A','B','C','D'];
const vIdx=(c,ex)=>(c-1)*2+(ex?1:0);
function fuelOK(c){const o=OUT.find(k=>EN3.map[k]===c);return !!o&&FO4[OUT.indexOf(o)]===c;}
function wrongFuel(c){const o=OUT.find(k=>EN3.map[k]===c);return !!o&&FO4[OUT.indexOf(o)]!==c;}
function tight(c){return EN3.clr[vIdx(c,0)]<0.13||EN3.clr[vIdx(c,1)]<0.2;}
function fires(c){return fuelOK(c)&&!tight(c)&&!EN3.bent;}
const firingCount=()=>[1,2,3,4].filter(fires).length;
const looseCount=()=>EN3.clr.filter((v,i)=>v>SPEC[i%2]+0.09).length;
const shiftDeg=()=>EN3.teeth*24;
function vlift(c,ex,th){const cyc=mod(th-OFF4[c]-shiftDeg(),720);return ex?liftF(cyc,exStart(),exDur()):liftF(cyc,inStart(),inDur());}
function onBase(c,ex,th){const cyc=mod(th-OFF4[c]-shiftDeg(),720),s=ex?exStart():inStart(),d=ex?exDur():inDur();const p=mod(cyc-s+20,720);return p>d+40;}
function quality(){ // 0 good .. 1 bad
 let q=0;if(Math.abs(EN3.teeth)===1)q+=.5;q+=(4-firingCount())*.2;if(EN3.inj)q+=.25;return Math.min(1,q);}
function smokeKind(){if(EN3.mode!=='run')return null;if([1,2,3,4].some(wrongFuel))return'white';if(Math.abs(EN3.teeth)===1||EN3.inj<0)return'black';if(EN3.inj>0)return'grey';return'clean';}

const Snd={ctx:null,
 init(){if(this.ctx){this.resume();return;}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let c;try{c=this.ctx=new AC();}catch(e){return;}
  const comp=c.createDynamicsCompressor();comp.connect(c.destination);this.m=c.createGain();this.m.gain.value=EN3.snd?0.9:0;this.m.connect(comp);

  this.st=c.createOscillator();this.st.type='sawtooth';this.st.frequency.value=80;const w=c.createOscillator();w.type='square';w.frequency.value=1150;const wg=c.createGain();wg.gain.value=.05;w.connect(wg);
  const slp=c.createBiquadFilter();slp.type='lowpass';slp.frequency.value=1000;this.stG=c.createGain();this.stG.gain.value=0;this.st.connect(slp);wg.connect(slp);slp.connect(this.stG).connect(this.m);this.st.start();w.start();this.w=w;
  this.next=c.currentTime;this.slot=0;setInterval(()=>this.sched(),25);this.resume();},

 setOn(v){if(this.m)this.m.gain.setTargetAtTime(v?0.9:0,this.ctx.currentTime,.05);},

  const n=c.createBufferSource();n.buffer=this.nb;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=480;const g2=c.createGain();this.env(g2,t,a*.8,.09);n.connect(f).connect(g2).connect(this.m);n.start(t,Math.random()*1.5);n.stop(t+.11);},

  [1870,2630,3410,4720,6100].forEach((fr,i)=>{const o=c.createOscillator();o.frequency.value=fr*(1+Math.random()*.02);const gg=c.createGain();this.env(gg,t+i*.012,.12,.9);o.connect(gg).connect(this.m);o.start(t);o.stop(t+1);});},

  this.rumG.gain.setTargetAtTime(rpm<5?0:Math.min(.55,.06+rpm/3200),now,.08);
  this.stG.gain.setTargetAtTime(EN3.mode==='crank'?.2:0,now,.03);this.st.frequency.setTargetAtTime(60+rpm*.15,now,.05);this.w.frequency.setTargetAtTime(900+rpm*2,now,.05);

   else if(run){if(fires(cyl)){let a=.55;const q=Math.abs(EN3.teeth)===1;if(q)a*=.45+Math.random()*.5;if(EN3.inj<0)a*=.6;this.thump(t,a);this.click(t+.003,EN3.inj>0?.7:(EN3.inj<0?.08:.16),EN3.inj>0?2400:2900,EN3.inj>0?.045:.025);}

   this.next+=iv;this.slot++;}
 }};

function gearGeo(T,R,n,th,hole){const sh=new T.Shape(),tw=Math.PI/n;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const p=[[R-.035,a-tw*.55],[R+.035,a-tw*.3],[R+.035,a+tw*.3],[R-.035,a+tw*.55]];p.forEach(([r,an],k)=>{const x=r*Math.cos(an),y=r*Math.sin(an);i===0&&k===0?sh.moveTo(x,y):sh.lineTo(x,y);});}
 if(hole){const hp=new T.Path();hp.absarc(0,0,hole,0,Math.PI*2,true);sh.holes.push(hp);}
 const g=new T.ExtrudeGeometry(sh,{depth:th,bevelEnabled:false,curveSegments:4});g.translate(0,0,-th/2);g.rotateY(Math.PI/2);return g;}

  else if(E.crankT>1.1&&firingCount()>=2&&!E.bent){E.mode='run';misEvent('started');}
  if(!startHeld&&E.mode==='crank'){E.mode='coast';if(E.crankT>1.1)misEvent('nostart');}}
