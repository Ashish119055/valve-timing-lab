  if(Math.abs(a-360)<=4){const st=Math.max(1,3-(MIS.tries-1)-(MIS.rev>2?1:0));theta=360;finish(1,st,tr(['શાબાશ! સિ.1 compression TDC પર છે — બંને વાલ્વ બંધ, cam gear નું નિશાન ઉપર.','शाबाश! सि.1 compression TDC पर है — दोनों वाल्व बंद, cam gear का निशान ऊपर।','Well done! Cyl 1 is at compression TDC — both valves closed, cam gear mark on top.']));}
  else if(a<=4||a>=716)mstat(tr(['❌ Flywheel TDC પર છે, પણ આ <b>exhaust TDC</b> છે — સિ.1 ના વાલ્વ rocking માં છે. Crank ને વધુ <b>360°</b> ફેરવો.','❌ Flywheel TDC पर है, पर यह <b>exhaust TDC</b> है — सि.1 के वाल्व rocking में हैं। Crank को और <b>360°</b> घुमाएँ।','❌ The flywheel is at TDC, but this is <b>exhaust TDC</b> — cyl 1 valves are rocking. Turn the crank another <b>360°</b>.']),'#fdeaea');
  else mstat(tr([`❌ હજુ TDC નથી. Flywheel: <b>${flyText(theta)}</b>. નિશાન pointer સામે લાવો.`,`❌ अभी TDC नहीं। Flywheel: <b>${flyText(theta)}</b>। निशान pointer के सामने लाएँ।`,`❌ Not at TDC yet. Flywheel: <b>${flyText(theta)}</b>. Bring the mark to the pointer.`]),'#fdeaea');};
 if(n===2){const upd=()=>mstat(tr([`Cam gear ગોઠવણ: ${EN3.teeth===0?'✅ નિશાન pointer સામે':'નિશાન '+Math.abs(EN3.teeth)+' દાંત '+(EN3.teeth>0?'પાછળ':'આગળ')}`,`Cam gear स्थिति: ${EN3.teeth===0?'✅ निशान pointer के सामने':'निशान '+Math.abs(EN3.teeth)+' दाँत '+(EN3.teeth>0?'पीछे':'आगे')}`,`Cam gear: ${EN3.teeth===0?'✅ mark at the pointer':'mark '+Math.abs(EN3.teeth)+' teeth '+(EN3.teeth>0?'behind':'ahead')}`]));
  const adj=d=>{if(EN3.bent){mstat(tr(['💥 વાલ્વ વળેલા છે — ઉપરથી "2. ટાઈમિંગ ગિયર" ફરી દબાવો.','💥 वाल्व मुड़े हैं — ऊपर से "2. टाइमिंग गियर" फिर दबाएँ।','💥 Valves are bent — tap "2. Timing gears" again.']),'#fdeaea');return;}if(EN3.mode!=='stop'){EN3.mode='stop';EN3.rpm=0;}MIS.meshed=false;EN3.teeth+=d;upd();};
  $('m2l').onclick=()=>adj(1);$('m2r').onclick=()=>adj(-1);
  $('m2mesh').onclick=()=>{MIS.meshed=true;mstat(tr(['⚙️ ગિયર ચડાવ્યો. હવે 🔑 એન્જિન ચાલુ કરી ચકાસો.','⚙️ गियर चढ़ा दिया। अब 🔑 इंजन चालू करके जाँचें।','⚙️ Gear fitted. Now 🔑 start the engine to test.']),'#f3f7fd');};}
 if(n===3){renderVChips();$('m3hint').onclick=()=>{const a=mod(theta,720);const c=FO4.find(c=>{const cy=mod(a-OFF4[c],720);return cy>320||cy<40;})||FO4[Math.floor(mod(a+40,720)/180)%4];
  mstat(tr(['💡 Rocking નિયમ (1-3-4-2): rocking + સેટ = 5. સિ.1 rocking → સિ.4 સેટ, સિ.3 → 2, સિ.4 → 1, સિ.2 → 3. Crank 180° ફેરવતા જાઓ.','💡 Rocking नियम (1-3-4-2): rocking + सेट = 5। सि.1 rocking → सि.4 सेट, सि.3 → 2, सि.4 → 1, सि.2 → 3। Crank 180° घुमाते जाएँ।','💡 Rocking rule (1-3-4-2): rocking + adjust = 5. Cyl 1 rocking → set cyl 4, 3 → 2, 4 → 1, 2 → 3. Keep turning 180°.']),'#fff7e0');};}
 if(n===4){renderPipes();}
 if(n===5)renderRound();
}
function renderVChips(){const b=$('vchips');if(!b)return;b.innerHTML=[1,2,3,4].map(c=>[0,1].map(ex=>{const i=vIdx(c,ex);return`<button class="vchip${MIS.okv[i]?' ok':''}${MIS.clrSel===i?' sel':''}" data-i="${i}">${c}-${ex?'E':'I'}${MIS.okv[i]?' ✅':''}</button>`;}).join('')).join('');
 document.querySelectorAll('.vchip').forEach(x=>x.onclick=()=>{const i=+x.dataset.i,c=Math.floor(i/2)+1,ex=i%2;if(EN3.mode!=='stop'){mstat(tr(['પહેલાં એન્જિન STOP કરો!','पहले इंजन STOP करें!','Stop the engine first!']),'#fdeaea');return;}
  if(R3)R3.setHL(i);
  if(!onBase(c,ex,theta)){MIS.tries++;MIS.clrSel=null;$('feelBox').innerHTML='';mstat(tr([`⛔ વાલ્વ ${c}-${ex?'E':'I'} હમણાં cam ના lobe/ramp પર છે (દબાયેલો). અહીં ગેપ ખોટો મપાશે! Crank ફેરવો — 💡 મદદ જુઓ.`,`⛔ वाल्व ${c}-${ex?'E':'I'} अभी cam के lobe/ramp पर है (दबा हुआ)। यहाँ गैप गलत नपेगा! Crank घुमाएँ — 💡 मदद देखें।`,`⛔ Valve ${c}-${ex?'E':'I'} is on the cam lobe/ramp now (pressed). The gap will read wrong! Turn the crank — see 💡 Hint.`]),'#fdeaea');renderVChips();return;}
  MIS.clrSel=i;MIS.gap=EN3.clr[i];renderVChips();renderFeel();});}
function renderFeel(){const i=MIS.clrSel,ex=i%2;$('feelBox').innerHTML=`<div class="cvbox"><canvas id="cFee" width="320" height="170"></canvas></div><div class="sl" style="margin-top:6px"><span>Screw</span><input type="range" id="feeSl" min="0" max="70" value="${Math.round(EN3.clr[i]*100)}"><span id="feeV"></span></div><div class="ctrl"><button class="btn pri" id="feeLock">🔩 Lock nut</button></div>`;
 const upd=()=>{EN3.clr[i]=+$('feeSl').value/100;$('feeV').textContent=EN3.clr[i].toFixed(2);drawFee(i);const d=EN3.clr[i]-SPEC[ex];
  mstat(Math.abs(d)<=.015?tr(['✅ હળવું ખેંચાણ (slight drag) — બરાબર! હવે Lock nut કસો.','✅ हल्का खिंचाव (slight drag) — सही! अब Lock nut कसें।','✅ Slight drag — correct! Now tighten the lock nut.']):d<0?tr([`⛔ Feeler ${SPEC[ex]} અંદર જતું નથી — ગેપ ઓછો. Screw ઢીલો કરો.`,`⛔ Feeler ${SPEC[ex]} अंदर नहीं जाता — गैप कम। Screw ढीला करें।`,`⛔ The ${SPEC[ex]} feeler won't enter — gap too small. Back off the screw.`]):tr(['⚠ Feeler ઢીલું સરકે છે — ગેપ વધારે. Screw કસો.','⚠ Feeler ढीला सरकता है — गैप ज़्यादा। Screw कसें।','⚠ The feeler slides loose — gap too large. Tighten the screw.']),Math.abs(d)<=.015?'#e6f7ec':'#fff4e5');};
 $('feeSl').addEventListener('input',upd);upd();
 $('feeLock').onclick=()=>{const d=EN3.clr[i]-SPEC[ex];if(Math.abs(d)<=.015){EN3.clr[i]=SPEC[ex];MIS.okv[i]=true;MIS.clrSel=null;$('feelBox').innerHTML='';if(R3)R3.setHL(-1);renderVChips();haptic(25);
   if(MIS.okv.every(x=>x)){finish(3,Math.max(1,3-Math.floor(MIS.tries/2)),tr(['બધા 8 વાલ્વ સેટ! હવે એન્જિન ચાલુ કરો — ટક-ટક ગાયબ!','सभी 8 वाल्व सेट! अब इंजन चालू करें — टक-टक गायब!','All 8 valves set! Start the engine — the tapping is gone!']));}
   else mstat(tr(['🔩 Lock! હવે બીજો વાલ્વ.','🔩 Lock! अब अगला वाल्व।','🔩 Locked! Next valve.']),'#e6f7ec');}
  else{MIS.tries++;mstat(tr(['ના! પહેલાં ગેપ બરાબર કરો, પછી જ lock કરો.','नहीं! पहले गैप सही करें, फिर ही lock करें।','No! Correct the gap first, then lock.']),'#fdeaea');}};}
function drawFee(i){const cv=$('cFee');if(!cv)return;const c=prepCanvas(cv);c.clearRect(0,0,320,170);const ex=i%2,spec=SPEC[ex],gap=EN3.clr[i],g=gap*110;
 c.fillStyle='#5d6d7e';c.save();c.translate(60,62);c.rotate(-.05);c.beginPath();c.roundRect?c.roundRect(0,-10,210,22,8):c.rect(0,-10,210,22);c.fill();c.restore();
 c.fillStyle='#2c3e50';c.beginPath();c.arc(110,60,9,0,7);c.fill();c.fillStyle='#c0392b';c.fillRect(244,24,10,46);c.fillStyle='#7f8c8d';c.fillRect(239,38,20,10);
 c.fillStyle=ex?'#ff7b5c':'#5c9dff';c.fillRect(243,76+g,12,170-76-g);
 const fits=gap>=spec-.015;c.fillStyle=fits?'rgba(32,163,90,.85)':'rgba(232,69,69,.85)';const th=spec*110;const by=fits?76+(g-th)/2:58;c.fillRect(150,by,fits?100:88,Math.max(2,th));
 c.fillStyle='#14213d';c.font='bold 11px Noto Sans,sans-serif';c.fillText('Feeler '+spec.toFixed(2)+' mm',150,by+th+14);c.fillStyle='#e67e22';c.fillText(gap.toFixed(2)+' mm',262,82+g/2);
 c.fillStyle='#555';c.font='10px Noto Sans,sans-serif';c.fillText((ex?'Exhaust':'Inlet')+' valve stem',150,164);c.fillText('Rocker',20,52);}
function renderPipes(){const o=$('m4o'),cc=$('m4c');if(!o)return;
 o.innerHTML=OUT.map((k,i)=>`<button class="btn${MIS.sel===k?' on':''} po" data-k="${k}">${k}${EN3.map[k]?' → '+EN3.map[k]:''}<br><small>${i+1}${['st','nd','rd','th'][i]}</small></button>`).join('');
 cc.innerHTML=[1,2,3,4].map(c=>`<button class="btn pc" data-c="${c}">${tr(['સિ.','सि.','Cyl '])}${c}</button>`).join('');
 document.querySelectorAll('.po').forEach(b=>b.onclick=()=>{MIS.sel=b.dataset.k;renderPipes();});
 document.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{if(!MIS.sel){mstat(tr(['પહેલાં આઉટલેટ (A-D) પસંદ કરો.','पहले आउटलेट (A-D) चुनें।','Pick an outlet (A-D) first.']),'#fff4e5');return;}const c=+b.dataset.c;OUT.forEach(k=>{if(EN3.map[k]===c)EN3.map[k]=null;});EN3.map[MIS.sel]=c;
  const nx=OUT.find(k=>!EN3.map[k]);MIS.sel=nx||null;if(R3)R3.buildPipes();renderPipes();});}
function misEvent(ev){if(!MIS.cur)return;const n=MIS.cur;
 if(n===2){if(ev==='crash'){mstat(tr(['💥 વાલ્વ વળી ગયા! Cam gear '+Math.abs(EN3.teeth)+' દાંત ખોટો હતો. નિશાન મેળવ્યા વગર ક્યારેય crank ન ફેરવો. "મિશન 2" ફરી દબાવો.','💥 वाल्व मुड़ गए! Cam gear '+Math.abs(EN3.teeth)+' दाँत गलत था। निशान मिलाए बिना कभी crank न घुमाएँ। "मिशन 2" फिर दबाएँ।','💥 Valves bent! The cam gear was '+Math.abs(EN3.teeth)+' teeth out. Never turn the crank without matching marks. Tap "Mission 2" again.']),'#fdeaea');MIS.tries++;}
  if(ev==='started'){if(EN3.teeth===0)setTimeout(()=>finish(2,Math.max(1,3-MIS.tries),tr(['એન્જિન સરસ ચાલ્યું! નિશાન બરાબર મળ્યા. ✅','इंजन बढ़िया चला! निशान ठीक मिले। ✅','Engine runs sweetly! Marks matched. ✅'])),1500);
   else{MIS.tries++;mstat(tr(['⚠ એન્જિન ખરાબ ચાલે છે — કાળો ધુમાડો, પાવર ઓછો. 1 દાંત (24°) ફરક! STOP કરી મિશન ફરી કરો.','⚠ इंजन खराब चलता है — काला धुआँ, पावर कम। 1 दाँत (24°) फर्क! STOP करके मिशन फिर करें।','⚠ Runs badly — black smoke, low power. 1 tooth (24°) out! Stop and redo the mission.']),'#fff4e5');}}}
 if(n===4&&ev==='started'){const k=firingCount();if(k===4)setTimeout(()=>finish(4,Math.max(1,3-MIS.tries),tr(['એકદમ smooth! A→1, B→3, C→4, D→2 ✅','एकदम smooth! A→1, B→3, C→4, D→2 ✅','Perfectly smooth! A→1, B→3, C→4, D→2 ✅'])),1500);
  else{MIS.tries++;mstat(tr([`⚠ માત્ર ${k} સિલિન્ડર ફાયર થાય છે — એન્જિન ધ્રુજે, સફેદ ધુમાડો. પાઇપ ફરી જોડો.`,`⚠ केवल ${k} सिलेंडर फायर होते हैं — इंजन कांपे, सफेद धुआँ। पाइप फिर जोड़ें।`,`⚠ Only ${k} cylinders fire — shaking, white smoke. Reconnect the pipes.`]),'#fff4e5');}}
 if(n===4&&ev==='nostart'){MIS.tries++;mstat(tr(['❌ એન્જિન ચાલુ ન થયું — ડીઝલ ખોટા સમયે જાય છે. પાઇપ ફરી જોડો.','❌ इंजन चालू नहीं हुआ — डीज़ल गलत समय पर जाता है। पाइप फिर जोड़ें।','❌ No start — fuel arrives at the wrong time. Reconnect the pipes.']),'#fdeaea');}
}
function lang3(){updToggles();buildSlow();buildRockChk();$('legend2').innerHTML=$('legend1').innerHTML;renderMis();}
function loop3(){if(MIS.cur)drawDial2();}

/* audio unlock (iOS) + stop sound when leaving */
['touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(Snd.ctx)Snd.resume();},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!Snd.ctx)return;if(document.hidden)Snd.ctx.suspend();else Snd.resume();});
function leave3D(){if(EN3.mode!=='stop'){EN3.mode='stop';EN3.rpm=0;}startHeld=false;}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(curTab!=='p3d'&&playing)theta=mod(theta+dt*90*speed,720);
 const a=Math.round(mod(theta,720));document.querySelectorAll('.thSlider').forEach(s=>{if(document.activeElement!==s||playing)s.value=a;});
 if(curTab==='p2d'){drawEngine(now);drawSpiral();drawGears();upd2DText();}
 else if(curTab==='p3d'&&R3){R3.frame();loop3();}
 else if(curTab==='pfo')drawRow();
 remT+=dt;if(remT>6){remT=0;remI=(remI+1)%REM.length;showRemind();}
 requestAnimationFrame(loop);
}
applyLang();onTVChange();setUI('run');init3D();resize3D();
requestAnimationFrame(loop);
